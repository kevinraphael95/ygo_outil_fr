<style>
:root, [data-theme="dark"] { color-scheme: dark; --bg: #0d0a1a; --bg-glow: rgba(212, 175, 55, 0.05); --surface: #16112a; --surface-2: #1f1838; --surface-3: #2a2148; --border: #3a2d5c; --border-strong: #4d3d75; --text: #f5ecd8; --text-muted: #a89b82; --text-dim: #7a705c; --gold: #d4af37; --gold-light: #e8c85a; --gold-dark: #a67c00; --gold-soft: rgba(212, 175, 55, 0.12); --gold-glow: rgba(212, 175, 55, 0.35); --success: #5fd07f; --success-soft: rgba(95, 208, 127, 0.13); --warning: #e0b64c; --warning-soft: rgba(224, 182, 76, 0.13); --danger: #e07a7a; --danger-soft: rgba(224, 122, 122, 0.13); --info: #b88ae0; --info-soft: rgba(155, 107, 196, 0.15); --shadow-sm: 0 1px 3px rgba(0,0,0,.5); --shadow-md: 0 6px 24px rgba(0,0,0,.5); --shadow-lg: 0 18px 50px rgba(0,0,0,.7); --code-bg: #0a0715; }
[data-theme="light"] { color-scheme: light; --bg: #f0e8d8; --bg-glow: rgba(166, 124, 0, 0.07); --surface: #faf5e8; --surface-2: #f2ebd9; --surface-3: #e8dfc5; --border: #d9cdb4; --border-strong: #bcab88; --text: #2a1f14; --text-muted: #6b5d47; --text-dim: #94856a; --gold: #a67c00; --gold-light: #c49616; --gold-dark: #7a5a00; --gold-soft: rgba(166, 124, 0, 0.10); --gold-glow: rgba(166, 124, 0, 0.28); --success: #1f8a3d; --success-soft: rgba(31, 138, 61, 0.11); --warning: #8f6a00; --warning-soft: rgba(166, 124, 0, 0.12); --danger: #c33a3a; --danger-soft: rgba(195, 58, 58, 0.10); --info: #6a3a9a; --info-soft: rgba(106, 58, 154, 0.10); --shadow-sm: 0 1px 2px rgba(60,40,10,.08); --shadow-md: 0 6px 20px rgba(60,40,10,.12); --shadow-lg: 0 18px 50px rgba(60,40,10,.2); --code-bg: #f6f0df; }
:root { --radius: 16px; --radius-sm: 10px; --font-display: 'Cinzel', Georgia, serif; --font-body: 'Inter', system-ui, -apple-system, sans-serif; --font-mono: ui-monospace, monospace; --ease: cubic-bezier(.2, .7, .3, 1); }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; font-family: var(--font-body); font-size: 15px; line-height: 1.55; color: var(--text); background-color: var(--bg); background-image: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, transparent 45%), radial-gradient(circle at 85% 100%, var(--bg-glow) 0%, transparent 45%); background-attachment: fixed; display: flex; flex-direction: column; }

.dropzone:hover, .dropzone.over { border-color: var(--gold); background: var(--gold-soft); color: var(--text); }

.deck h3 { margin: 0 0 4px; font-size: 1.02rem; }
.deck .stats { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
.deck .ok { color: var(--success); font-weight: 600; } .deck .ko { color: var(--danger); font-weight: 600; }
.miss { font: 12.5px var(--font-mono); color: var(--text-muted); background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
.toasts { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 44px)); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-left: 4px solid var(--success); box-shadow: var(--shadow-lg); pointer-events: auto; animation: toastIn .3s var(--ease); }
.toast.err { border-left-color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
</style>
<script>
(function () {
    const KEY = 'ygo_theme';
    const root = document.documentElement;
    function preferred() {
        try { const saved = localStorage.getItem(KEY); if (saved === 'dark' || saved === 'light') return saved; } catch (e) {}
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        if (btn) { btn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>'; }
    }
    applyTheme(preferred());
    document.addEventListener('DOMContentLoaded', () => {
        applyTheme(root.getAttribute('data-theme'));
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (e) {}
            applyTheme(next);
        });
    });
    const YGO = {};
    YGO.$ = (id) => document.getElementById(id);
    YGO.sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    YGO.el = function (tag, props, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
            if (v == null || v === false) continue;
            if (k === 'className') node.className = v;
            else if (k === 'text') node.textContent = v;
            else if (k === 'dataset') Object.assign(node.dataset, v);
            else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
            else node.setAttribute(k, v === true ? '' : v);
        }
        for (const c of children.flat()) { if (c != null && c !== false) node.append(c.nodeType ? c : document.createTextNode(String(c))); }
        return node;
    };
    YGO.toast = function (message, type = 'ok') {
        let box = document.getElementById('toasts');
        if (!box) { box = YGO.el('div', { className: 'toasts', id: 'toasts' }); document.body.append(box); }
        const t = YGO.el('div', { className: 'toast ' + type }, YGO.el('i', { className: 'fa-solid ' + (type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation') }), YGO.el('span', { text: message }));
        box.append(t);
        setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3600);
    };
    YGO.download = function (data, filename, mime = 'application/octet-stream') {
        const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = YGO.el('a', { href: url, download: filename });
        document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
    YGO.initSql = () => initSqlJs({ locateFile: (f) => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f });
    window.YGO = YGO;
})();
</script>

<body>

<button class="icon-btn" id="theme-toggle" type="button" style="position:fixed;top:14px;right:14px;z-index:60;"></button>

<main class="container wide">
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-file-export"></i></div>
        <div>
            <h1>Deck vers <span class="grad">YDK</span></h1>

    </section>

    <div class="card">

        <div class="row">

            <button class="btn" id="changeBtn" type="button"><i class="fa-solid fa-folder-tree"></i> Changer de dossier</button>

        <div class="row" style="margin-top:10px; margin-bottom: 10px;">
            <label class="check">
                <input type="checkbox" id="optPreferCustom" checked>
                <span>Ne garder <strong>que</strong> les cartes custom VAACT (utile pour le XML)</span>
            </label>
        </div>

        <details id="manual" style="margin-bottom:10px;">
            <summary style="cursor:pointer; color: var(--text-muted); font-size: 12px;">Autre méthode (Firefox)</summary>
            <div class="row" style="margin-top:8px;">
                <label for="folderInput" class="btn"><i class="fa-solid fa-folder-plus"></i> Ajouter un dossier</label>
                <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden">
                <label for="fileInput" class="btn"><i class="fa-solid fa-file-circle-plus"></i> Ajouter des .cdb</label>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-file-code"></i> 2. Decks .xml ou .json</h2>

            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span><strong>Glisse tes fichiers ici</strong> (.xml ou .json)</span>
        </label>
        <input type="file" id="xmlInput" accept=".xml,.json" multiple class="hidden">
        <div class="row" style="margin-top:14px;">
            <button class="btn btn-primary" id="allBtn" type="button" disabled><i class="fa-solid fa-download"></i> Tout télécharger (.ydk)</button>
        </div>
        <div id="decks"></div>
    </div>
</main>

<div class="toasts" id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
const { $ } = YGO;
const CONFIG = { BASE: 'C:\\ProjectIgnis', SEARCH_PATHS: ['expansions', 'config/languages'], CUSTOM_MIN_ID: 900000000 };
const EXTRA_MASK = 0x40 | 0x2000 | 0x800000 | 0x4000000;

let SQL = null;
const byName = new Map();
const types = new Map();
const loaded = new Set();
let nbCdb = 0;
const results = [];

const sqlReady = YGO.initSql().then((s) => { SQL = s; }).catch((e) => setStatus('Impossible de charger sql.js : ' + e.message));
const setStatus = (t) => { $('status').textContent = t; };
const norm = (s) => String(s || '').normalize('NFD').toLowerCase().replace(/\p{M}/gu, '').replace(/[^\p{L}\p{N}]/gu, '');
const stripTag = (s) => String(s || '').replace(/\s*\((buff|nerf)\)\s*$/i, '');

async function addFiles(items) {
    await sqlReady; if (!SQL) return;
    const files = items.filter((x) => /\.cdb$/i.test(x.file.name));
    if (!files.length) return YGO.toast('Aucun .cdb trouvé.', 'err');
    let added = 0, bad = 0;
    for (const { file: f, rel } of files) {
        if (loaded.has(rel)) continue;
        setStatus(`Lecture de ${rel}…`);
        try {
            const db = new SQL.Database(new Uint8Array(await f.arrayBuffer()));
            const t = db.exec('SELECT id, name FROM texts');
            for (const [id, name] of (t.length ? t[0].values : [])) {
                const n = norm(name); if (!n) continue;
                if (!byName.has(n)) byName.set(n, new Set());
                byName.get(n).add(id);
            }
            try {
                const d = db.exec('SELECT id, type FROM datas');
                for (const [id, type] of (d.length ? d[0].values : [])) types.set(id, type);
            } catch (e) {}
            db.close();
            loaded.add(rel); nbCdb++; added++;
        } catch (e) { bad++; }
        await YGO.sleep(0);
    }
    setStatus(`${nbCdb} .cdb lus · ${byName.size.toLocaleString('fr-FR')} noms` + (bad ? ` · ${bad} ignoré(s)` : ''));
    YGO.toast(`${added} .cdb ajoutés.`);
}

const asItems = (l) => l.map((f) => ({ file: f, rel: f.webkitRelativePath || f.name }));
$('folderInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; addFiles(asItems(l)); });
$('fileInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; addFiles(asItems(l)); });
$('clearBtn').addEventListener('click', () => { byName.clear(); types.clear(); loaded.clear(); nbCdb = 0; setStatus('Vidé.'); });

function findId(cardEl, deckAverageId) {
    const passcode = (cardEl.getAttribute('passcode') || '').trim();
    const onlyCustom = $('optPreferCustom').checked; 
    if (!onlyCustom && /^\d+$/.test(passcode) && Number(passcode) > 0) return Number(passcode);
    const name = (cardEl.textContent || '').trim();
    for (const candidate of [name, stripTag(name)]) {
        const set = byName.get(norm(candidate));
        if (!set || !set.size) continue;
        let ids = [...set];
        if (onlyCustom) {
            ids = ids.filter((id) => id >= CONFIG.CUSTOM_MIN_ID);
            if (!ids.length) continue;
            if (ids.length > 1 && deckAverageId > 0) return ids.sort((a, b) => Math.abs(a - deckAverageId) - Math.abs(b - deckAverageId))[0];
            return ids.sort((a, b) => a - b)[0];
        }
        return ids.sort((a, b) => a - b)[0];
    }
    return null;
}

// --- LOGIQUE XML ---
function convertXml(text, filename) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('XML invalide');
    const deck = doc.documentElement;
    let sum = 0, count = 0;
    for (const part of deck.children) {
        for (const c of part.children) {
            const passcode = (c.getAttribute('passcode') || '').trim();
            if (/^\d+$/.test(passcode) && Number(passcode) > CONFIG.CUSTOM_MIN_ID) { sum += Number(passcode); count++; }
        }
    }
    const deckAverageId = count > 0 ? Math.round(sum / count) : 0;

    const sec = { main: [], extra: [], side: [] };
    const missing = [];
    for (const part of deck.children) {
        const tag = part.tagName.toLowerCase();
        if (!(tag in sec)) continue;
        for (const c of part.children) {
            const id = findId(c, deckAverageId);
            if (id == null) missing.push(`(${tag}) ${(c.textContent || '').trim()}`);
            else sec[tag].push(id);
        }
    }
    const main = [], extra = [...sec.extra];
    for (const id of sec.main) (types.has(id) && (types.get(id) & EXTRA_MASK) ? extra : main).push(id);
    
    const lines = ['#created by xml_to_ydk', '#main', ...main, '#extra', ...extra, '!side', ...sec.side];
    for (const m of missing) lines.push('# INTROUVABLE ' + m);
    return { name: deck.getAttribute('name') || filename.replace(/\.xml$/i, ''), ydk: lines.join('\n') + '\n', counts: { main: main.length, extra: extra.length, side: sec.side.length }, missing };
}

// --- LOGIQUE JSON (DuelingBook) ---
function convertJson(text, filename) {
    const data = JSON.parse(text.replace(/^\uFEFF/, ''));
    const sec = { main: [], extra: [], side: [] };
    
    // On extrait les IDs directement (pas besoin des .cdb)
    if (data.main) for (const c of data.main) if (c && c.id) sec.main.push(parseInt(c.id));
    if (data.extra) for (const c of data.extra) if (c && c.id) sec.extra.push(parseInt(c.id));
    if (data.side) for (const c of data.side) if (c && c.id) sec.side.push(parseInt(c.id));

    const lines = ['#created by json_to_ydk', '#main', ...sec.main, '#extra', ...sec.extra, '!side', ...sec.side];
    
    return { 
        name: data.name || filename.replace(/\.json$/i, ''), 
        ydk: lines.join('\n') + '\n', 
        counts: { main: sec.main.length, extra: sec.extra.length, side: sec.side.length }, 
        missing: [] 
    };
}

const safeName = (s) => s.replace(/[\\/:*?"<>|]+/g, '_').trim() || 'deck';

function renderDeck(r, filename) {
    const box = document.createElement('div'); box.className = 'deck';
    box.innerHTML = `<h3>${r.name}</h3>
        <div class="stats">Main ${r.counts.main} · Extra ${r.counts.extra} · Side ${r.counts.side} — 
        ${r.missing.length ? `<span class="ko">${r.missing.length} introuvable(s)</span>` : '<span class="ok">tout est là</span>'}</div>
        ${r.missing.length ? `<div class="miss">${r.missing.join('\n')}</div>` : ''}`;
    
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn btn-primary btn-sm';
    btn.innerHTML = '<i class="fa-solid fa-download"></i> Télécharger le .ydk';
    btn.onclick = () => YGO.download(r.ydk, safeName(filename.replace(/\.[^.]+$/, '')) + '.ydk', 'text/plain');
    box.append(btn);
    $('decks').append(box);
}

async function handleFiles(files) {
    if (!nbCdb) YGO.toast('Info : Aucun .cdb chargé (le JSON marchera, le XML risque d\'avoir des manques).');
    $('decks').innerHTML = ''; results.length = 0;
    for (const f of files) {
        try {
            let r;
            if (/\.json$/i.test(f.name)) r = convertJson(await f.text(), f.name);
            else if (/\.xml$/i.test(f.name)) r = convertXml(await f.text(), f.name);
            else continue;

            results.push({ filename: safeName(f.name.replace(/\.[^.]+$/, '')) + '.ydk', ydk: r.ydk });
            renderDeck(r, f.name);
        } catch (e) {
            const box = document.createElement('div'); box.className = 'deck';
            box.innerHTML = `<span class="ko">${f.name} : ${e.message}</span>`; $('decks').append(box);
        }
    }
    $('allBtn').disabled = !results.length;
}

$('xmlInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; handleFiles(l); });
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => handleFiles([...e.dataTransfer.files]));
$('allBtn').addEventListener('click', async () => {
    for (const r of results) { YGO.download(r.ydk, r.filename, 'text/plain'); await YGO.sleep(300); }
});

// ===== DOSSIER PROJECTIGNIS =====
const FS = !!window.showDirectoryPicker;
const kv = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('ygo-cdb-finder', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode), req = fn(tx.objectStore('kv')); tx.oncomplete = () => res(req.result); tx.onerror = () => rej(tx.error); };
});
const saveHandle = (h) => kv('readwrite', (st) => st.put(h, 'base'));
const getHandle = () => kv('readonly', (st) => st.get('base')).catch(() => null);

async function walk(dir, rel, out) {
    for await (const [name, h] of dir.entries()) {
        if (h.kind === 'directory') await walk(h, rel + '/' + name, out);
        else if (/\.cdb$/i.test(name)) out.push({ file: await h.getFile(), rel: rel + '/' + name });
    }
}
async function loadFromHandle(base) {
    setStatus('Recherche des .cdb…'); const items = [];
    for (const p of CONFIG.SEARCH_PATHS) {
        try {
            let d = base;
            for (const seg of p.split('/')) d = await d.getDirectoryHandle(seg);
            await walk(d, p, items);
        } catch (e) {}
    }
    await addFiles(items);
}
async function pickBase() {
    try {
        const h = await window.showDirectoryPicker({ mode: 'read' });
        await saveHandle(h); await loadFromHandle(h);
    } catch (e) { if (e.name !== 'AbortError') YGO.toast('Erreur : ' + e.message, 'err'); }
}
$('loadBtn').addEventListener('click', async () => {
    const h = await getHandle();
    if (!h) return pickBase();
    if ((await h.requestPermission({ mode: 'read' })) !== 'granted') return YGO.toast('Autorisation refusée.', 'err');
    loadFromHandle(h);
});
$('changeBtn').addEventListener('click', pickBase);

(async () => {
    if (!FS) { $('loadBtn').disabled = $('changeBtn').disabled = true; $('manual').open = true; return; }
    const h = await getHandle();
    if (h && (await h.queryPermission({ mode: 'read' })) === 'granted') return loadFromHandle(h);
    setStatus(h ? 'Clique sur "Charger" (autorisation à redonner).' : 'Clique sur "Charger" pour choisir ton dossier ProjectIgnis.');
})();
</script>
