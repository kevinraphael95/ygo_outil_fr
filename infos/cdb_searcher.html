<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chercheur de cartes · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../utils/ygo.css">
<script src="../utils/ygo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="../index.html" title="Accueil">
      <div class="brand-logo"><i class="fa-solid fa-dragon"></i></div>
      <div>
        <div class="brand-name">YGO Tools</div>
        <div class="brand-sub">Boîte à outils Yu-Gi-Oh!</div>
      </div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" type="button"></button>
    </div>
  </div>
</header>

<main class="container wide">
  <section class="hero">
    <div class="hero-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
    <div>
      <h1>Chercheur de <span class="grad">cartes</span></h1>
      <p>Cherche une carte par son nom dans les CDB du dépôt. Ça se charge tout seul.</p>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <input type="text" id="q" class="grow" placeholder="Nom de carte… (=nom pour exact)" autocomplete="off">
      <button class="btn btn-sm" id="clearBtn" type="button" title="Effacer la recherche"><i class="fa-solid fa-xmark"></i></button>
      <select id="lang" title="Langue"></select>
      <label class="check"><input type="checkbox" id="exact"> Exact</label>
    </div>
    <div class="hint" id="status" style="margin-top:10px;">Chargement…</div>
  </section>

  <div class="finder">
    <section class="card panel">
      <div class="toolbar">
        <span class="hint" id="count"></span>
      </div>
      <div id="results"></div>
    </section>
    <section class="card panel">
      <div id="detail"><div class="hint">Clique sur une carte pour voir son détail.</div></div>
    </section>
  </div>

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <button class="btn btn-sm" id="loadFiles" type="button"><i class="fa-solid fa-file-circle-plus"></i> Ajouter des .cdb locaux</button>
    <input type="file" id="filesInput" accept=".cdb" multiple class="hidden">
  </div>
</main>

<footer class="app-footer">YGO Tools · tout s'exécute dans ton navigateur</footer>
<div class="toasts" id="toasts"></div>

<script>
const { $ } = YGO;
const log = YGO.console(YGO.el('div'));

const entries = new Map();   // id -> [{lang, name, desc, rel}]
const names = [];            // [nom normalisé, id]
const loaded = new Set();
let SQL = null;
let timer = null;

const MAX_RESULTS = 300;
const LANG_LABEL = { en: 'Anglais', fr: 'Français', de: 'Allemand', it: 'Italien', pt: 'Portugais', es: 'Espagnol', ja: 'Japonais', ko: 'Coréen', zh: 'Chinois' };
const LANG_ROOT = 'config/languages';
const LANG_DIR = LANG_ROOT.split('/').pop().toLowerCase();

const setStatus = (t) => { $('status').textContent = t; };
const sqlReady = YGO.initSql()
  .then((s) => { SQL = s; })
  .catch((e) => setStatus('sql.js : ' + e.message));

async function addFiles(items) {
  await sqlReady;
  if (!SQL) return YGO.toast('sql.js indisponible', 'err');
  const files = items.filter((x) => /\.cdb$/i.test(x.file.name));
  if (!files.length) return YGO.toast('Aucun .cdb trouvé', 'err');

  let added = 0, bad = 0;
  for (const { file, rel } of files) {
    if (loaded.has(rel)) continue;
    setStatus(`Lecture de ${rel}…`);
    try {
      const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
      const res = db.exec('SELECT id, name, "desc" FROM texts');
      db.close();
      const lang = langOf(rel);
      for (const [id, name, desc] of (res[0] ? res[0].values : [])) {
        if (!name) continue;
        if (!entries.has(id)) entries.set(id, []);
        entries.get(id).push({ lang, name, desc: desc || '', rel });
        const n = YGO.norm(name);
        if (n) names.push([n, id]);
      }
      loaded.add(rel); added++;
    } catch (e) { bad++; log.log(rel + ' : ' + e.message, 'warn'); }
    await YGO.sleep(0);
  }
  setStatus(`${loaded.size} CDB · ${entries.size.toLocaleString('fr-FR')} cartes` + (bad ? ` · ${bad} ignoré(s)` : ''));
  if (added) YGO.toast(`${added} CDB ajouté(s)`);
  refreshLangs();
  runSearch();
}

function langOf(rel) {
  const parts = rel.split('/');
  const i = parts.findIndex((p) => p.toLowerCase() === LANG_DIR);
  return i >= 0 && parts.length > i + 2 ? parts[i + 1] : 'nontrad';
}

async function loadFromRepo() {
  const manifest = await YGO.data.manifest();
  const langs = Object.keys(manifest.cdb || {}).filter((l) => (manifest.cdb[l] || []).length);
  if (!langs.length) throw new Error('data/manifest.json ne liste aucun CDB');
  const items = [];
  for (const lang of langs) {
    for (const f of await YGO.data.cdbFiles(lang)) {
      items.push({ file: f, rel: `repo/${lang}/${f.name}` });
    }
  }
  await addFiles(items);
}

/* ---------- Fichiers locaux ---------- */
$('loadFiles').addEventListener('click', () => $('filesInput').click());
$('filesInput').addEventListener('change', (e) => {
  const l = [...e.target.files]; e.target.value = '';
  addFiles(l.map((f) => ({ file: f, rel: f.name })));
});

/* ---------- Filtre langue ---------- */
function refreshLangs() {
  const sel = $('lang');
  const current = sel.value || 'all';
  const langs = new Set(['all']);
  for (const arr of entries.values()) {
    for (const e of arr) {
      if (e.lang !== 'nontrad') langs.add(e.lang);
    }
  }
  sel.innerHTML = '';
  for (const l of [...langs].sort((a, b) => (a === 'all' ? -1 : b === 'all' ? 1 : a.localeCompare(b)))) {
    const label = l === 'all' ? 'Toutes les langues' : (LANG_LABEL[l] || l);
    sel.append(YGO.el('option', { value: l, text: label }));
  }
  sel.value = [...sel.options].some((o) => o.value === current) ? current : 'all';
}

/* ---------- Recherche ---------- */
function search(query, exact, lang) {
  const q = YGO.norm(query);
  if (!q) return [];
  const best = new Map();
  for (const [n, id] of names) {
    if (lang !== 'all' && !(entries.get(id) || []).some((e) => e.lang === lang)) continue;
    let score;
    if (exact) { if (n !== q) continue; score = [0, n.length]; }
    else { if (!n.includes(q)) continue; score = [n === q ? 0 : 1, n.length]; }
    const old = best.get(id);
    if (!old || score[0] < old[0] || (score[0] === old[0] && score[1] < old[1])) best.set(id, score);
  }
  return [...best].sort((a, b) => a[1][0] - b[1][0] || a[1][1] - b[1][1] || a[0] - b[0]).map((x) => x[0]);
}

function runSearch() {
  let q = $('q').value.trim();
  let exact = $('exact').checked;
  if (q.startsWith('=')) { exact = true; q = q.slice(1); }
  const lang = $('lang').value || 'all';

  const box = $('results');
  box.innerHTML = '';

  if (!q) {
    $('count').textContent = '';
    return showDetail(null);
  }

  const ids = search(q, exact, lang);
  $('count').textContent = ids.length
    ? ids.length + ' résultat(s)' + (ids.length > MAX_RESULTS ? ` — ${MAX_RESULTS} premiers affichés` : '')
    : 'Aucune carte trouvée.';

  for (const id of ids.slice(0, MAX_RESULTS)) {
    const arr = entries.get(id);
    
    // Affiche le nom dans la langue sélectionnée (ou le premier trouvé si "Toutes")
    let nomAffiche;
    if (lang !== 'all') {
      const match = arr.find((x) => x.lang === lang);
      nomAffiche = match ? match.name : arr[0].name;
    } else {
      nomAffiche = arr[0].name; // Prend le premier disponible (souvent le français si chargé)
    }

    const li = YGO.el('li', {
      onClick: () => {
        box.querySelectorAll('li.sel').forEach((x) => x.classList.remove('sel'));
        li.classList.add('sel');
        showDetail(id);
      },
    });
    
    li.textContent = nomAffiche;
    box.append(li);
  }
  if (ids.length === 1) showDetail(ids[0]);
}

function showDetail(id) {
  const det = $('detail'); det.innerHTML = '';
  if (id == null) {
    det.append(YGO.el('div', { className: 'hint', text: 'Clique sur une carte pour voir son détail.' }));
    return;
  }
  const arr = entries.get(id) || [];
  det.append(YGO.el('div', { className: 'd-id', text: 'ID ' + id }));

  const lang = $('lang').value || 'all';
  const shown = lang === 'all'
    ? arr.slice().sort((a, b) => (a.lang !== 'en') - (b.lang !== 'en') || a.lang.localeCompare(b.lang))
    : arr.filter((e) => e.lang === lang);

  for (const e of shown) {
    det.append(
      YGO.el('div', { className: 'd-lang', text: e.lang === 'nontrad' ? 'Sans langue' : (LANG_LABEL[e.lang] || e.lang) }),
      YGO.el('div', { className: 'd-name', text: e.name }),
    );
    if (e.desc.trim()) det.append(YGO.el('div', { className: 'd-desc', text: e.desc.replace(/\r\n/g, '\n').trim() }));
  }
}

/* ---------- Écouteurs ---------- */
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 180); });
$('exact').addEventListener('change', runSearch);
$('lang').addEventListener('change', runSearch);
$('clearBtn').addEventListener('click', () => { $('q').value = ''; runSearch(); $('q').focus(); });

/* ---------- Init ---------- */
(async () => {
  try {
    await loadFromRepo();
  } catch (e) {
    log.log('Dépôt : ' + e.message, 'err');
    setStatus('Lecture du dépôt impossible : ' + e.message);
  }
})();
</script>

<style>
  /* Deux colonnes : liste à gauche, détail à droite */
  .finder { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .finder > .panel { margin-bottom: 0; height: max(480px, calc(100vh - 340px)); overflow: auto; }

  /* La liste des résultats */
  #results { margin: 0; padding: 0; list-style: none; }
  #results li {
    display: block; padding: 8px 10px; margin-bottom: 4px; border-radius: 8px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border); color: inherit; font: inherit;
    transition: all .15s;
  }
  #results li:hover { border-color: var(--gold); }
  /* La sélection est bien visible (fond doré) */
  #results li.sel { border-color: var(--gold); background: var(--gold-soft); color: var(--text); }

  /* Le détail */
  .d-id    { font-family: var(--font-display); color: var(--gold); font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .d-lang  { margin-top: 12px; font: 700 .72rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--info); }
  .d-name  { font-weight: 700; }
  .d-desc  { white-space: pre-wrap; color: var(--text-muted); line-height: 1.5; margin-top: 4px; padding: 8px 10px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--border); }

  @media (max-width: 900px) {
    .finder { grid-template-columns: 1fr; }
    .finder > .panel { height: auto; max-height: 60vh; }
  }
</style>
</body>
</html>
