<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Convertisseur d'URL images — multi</title>
<style>
  :root, [data-theme="light"] {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #fafbfc;
    --border: #e0e4e8; --text: #1a1a1a; --text-muted: #666;
    --accent: #4a7fd6; --accent-hover: #3a6fc6; --accent-soft: #eef4fc;
    --success: #1a7a3a; --success-soft: #e8f5ec;
    --warn: #c08020; --warn-soft: #fdf3dc;
    --err: #c0392b; --err-soft: #fae0dd;
  }
  [data-theme="dark"] {
    --bg: #16161e; --surface: #1e1e28; --surface-2: #252530;
    --border: #2e2e3c; --text: #e4e4ea; --text-muted: #a0a0b0;
    --accent: #5a8fe6; --accent-hover: #4a7fd6; --accent-soft: rgba(90,143,230,.12);
    --success: #5fd07f; --success-soft: rgba(95,208,127,.14);
    --warn: #e0b64c; --warn-soft: rgba(224,182,76,.14);
    --err: #e07a7a; --err-soft: rgba(224,122,122,.14);
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 1200px; margin: 30px auto; padding: 20px;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 0; }

  .theme-btn {
    width: 42px; height: 42px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; font-size: 18px; cursor: pointer;
    color: var(--text); font-family: inherit; transition: all .15s;
  }
  .theme-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }

  label {
    display: block; font-weight: 600; font-size: 13px;
    margin-bottom: 8px; color: var(--text);
  }

  textarea {
    width: 100%; min-height: 150px;
    padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: 'SF Mono', Consolas, monospace; font-size: 12px;
    background: var(--surface-2); color: var(--text);
    resize: vertical; line-height: 1.5;
  }
  textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .row {
    display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap; margin-top: 12px;
  }
  button {
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all .15s; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface-2); color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .btn-mini {
    padding: 4px 10px; font-size: 11px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-soft);
  }
  .btn-mini:hover { background: var(--accent); color: #fff; }
  .btn-mini.copied { background: var(--success); color: #fff; border-color: var(--success); }

  .stats {
    font-size: 12px; color: var(--text-muted);
    margin-top: 10px; min-height: 18px;
  }
  .stats .ok { color: var(--success); font-weight: 700; }
  .stats .warn { color: var(--warn); font-weight: 700; }
  .stats .err { color: var(--err); font-weight: 700; }

  .table-wrap {
    overflow-x: auto; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface);
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 12px;
    font-family: 'SF Mono', Consolas, monospace;
  }
  th, td {
    padding: 10px 12px; text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  th {
    background: var(--surface-2); font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); position: sticky; top: 0; z-index: 2;
  }
  tr:hover td { background: var(--surface-2); }
  td.url-cell { max-width: 360px; word-break: break-all; }
  td.url-cell .val {
    user-select: all; line-height: 1.4;
    color: var(--text);
  }
  td.url-cell .val.ok { color: var(--success); }
  td.url-cell .val.warn { color: var(--warn); }
  td.url-cell .val.err { color: var(--err); }

  td.preview-cell {
    width: 60px; text-align: center;
  }
  td.preview-cell img {
    width: 40px; height: auto; border-radius: 4px;
    cursor: pointer; transition: transform .15s;
  }
  td.preview-cell img:hover { transform: scale(2.5); z-index: 10; position: relative; }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-muted); font-size: 13px;
  }

  .toolbar {
    display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 10px;
    margin-bottom: 12px;
  }
  .toolbar-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
  }

  .filter {
    padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface-2);
    color: var(--text); font-size: 12px; font-family: inherit;
    cursor: pointer;
  }
  .filter.active {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🔗 Convertisseur d'URL images — multi</h1>
    <p class="sub">
      Colle un paquet d'URLs Yugipedia (une par ligne), récupère les 3 versions de chacune.
    </p>
  </div>
  <button class="theme-btn" id="themeBtn" title="Changer de thème">🌙</button>
</header>

<div class="panel">
  <label for="input">URLs à convertir (une par ligne)</label>
  <textarea id="input" placeholder="https://ms.yugipedia.com/0/09/NaturalSelection-OW.png
https://ms.yugipedia.com/X/YY/Excalibur-OW.png
https://yugipedia.com/wiki/Special:Redirect/file/SpellbindingIllusion-JP-Manga-R-CA.png
File.png"></textarea>

  <div class="row">
    <button class="btn-primary" id="convertBtn">🔄 Convertir</button>
    <button class="btn-secondary" id="clearBtn">🗑️ Effacer</button>
    <button class="btn-secondary" id="exampleBtn">📥 Exemple</button>
  </div>

  <div class="stats" id="stats"></div>
</div>

<div id="results-panel" class="hidden">
  <div class="toolbar">
    <div class="toolbar-actions">
      <button class="filter active" data-filter="all">Tout</button>
      <button class="filter" data-filter="ok">✅ OK</button>
      <button class="filter" data-filter="warn">⚠️ Fallback</button>
      <button class="filter" data-filter="err">❌ Invalide</button>
    </div>
    <div class="toolbar-actions">
      <button class="btn-secondary" id="copyAllDirect">📋 Toutes les URLs directes</button>
      <button class="btn-secondary" id="copyAllWeserv">📋 Toutes les URLs weserv</button>
      <button class="btn-secondary" id="exportTxt">💾 Exporter .txt</button>
      <button class="btn-secondary" id="exportJson">💾 Exporter .json</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="resultsTable">
      <thead>
        <tr>
          <th style="width:50px;">Aperçu</th>
          <th style="width:200px;">Nom de fichier</th>
          <th>URL directe</th>
          <th>URL weserv</th>
          <th style="width:160px;">Actions</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<div class="panel" id="empty-panel">
  <div class="empty">
    Colle des URLs ci-dessus, puis clique sur <strong>Convertir</strong>.
  </div>
</div>

<script>
// ============================================================================
// THÈME
// ============================================================================
const THEME_KEY = 'url-converter-theme';
const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  applyTheme(saved || (mq.matches ? 'dark' : 'light'));
  mq.addEventListener('change', (e) => {
    if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
  });
})();
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = (document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

// ============================================================================
// ÉTAT
// ============================================================================
let allResults = []; // [{ raw, filename, directUrl, weservUrl, status }]
let currentFilter = 'all';

// ============================================================================
// CONVERSION
// ============================================================================

// Détecte le format d'entrée et normalise vers
// { filename, directUrl, weservUrl, status: 'ok'|'warn'|'err' }
function parseUrl(raw) {
  let s = String(raw || '').trim();
  if (!s) return null;

  // Cas 1 : URL sur ms.yugipedia.com → on garde tel quel
  if (/^https?:\/\/ms\.yugipedia\.com\//i.test(s)) {
    const filename = s.split('/').pop().split('?')[0];
    return {
      filename,
      directUrl: s,
      weservUrl: `https://images.weserv.nl/?url=${encodeURIComponent(s.replace(/^https?:\/\//, ''))}`,
      status: 'ok',
    };
  }

  // Cas 2 : Special:Redirect/file/File.png
  let m = s.match(/Special:Redirect\/file\/(.+?)(?:\?|$)/i);
  if (m) return buildFromFilename(decodeURIComponent(m[1]));

  // Cas 3 : wiki/File:File.png
  m = s.match(/\/wiki\/File:(.+?)(?:\?|$)/i);
  if (m) return buildFromFilename(decodeURIComponent(m[1]));

  // Cas 4 : juste un nom de fichier
  if (/\.(png|jpg|jpeg|gif|webp)$/i.test(s) && !s.includes('/')) {
    return buildFromFilename(s);
  }

  // Cas 5 : autre URL http(s) → on traite comme "non-Yugipedia"
  if (/^https?:\/\//i.test(s)) {
    const filename = s.split('/').pop().split('?')[0];
    return {
      filename,
      directUrl: s,
      weservUrl: `https://images.weserv.nl/?url=${encodeURIComponent(s.replace(/^https?:\/\//, ''))}`,
      status: 'warn',
      note: 'Domaine non-Yugipedia',
    };
  }

  return {
    filename: s,
    directUrl: null,
    weservUrl: null,
    status: 'err',
    note: 'Format non reconnu',
  };
}

// Construit une URL Special:Redirect à partir d'un nom de fichier seul.
// Utilisé quand on n'a pas le chemin /X/YY/ complet.
function buildFromFilename(filename) {
  return {
    filename,
    directUrl: `https://yugipedia.com/wiki/Special:Redirect/file/${encodeURIComponent(filename)}`,
    weservUrl: `https://images.weserv.nl/?url=yugipedia.com/wiki/Special:Redirect/file/${encodeURIComponent(filename)}`,
    status: 'warn',
    note: 'Chemin inconnu — utilise Special:Redirect',
  };
}

// ============================================================================
// TRAITEMENT DU PAQUET
// ============================================================================
function processInput() {
  const text = document.getElementById('input').value;
  const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);

  if (!lines.length) {
    allResults = [];
    renderResults();
    return;
  }

  // Déduplique les URLs identiques
  const seen = new Set();
  const unique = [];
  for (const line of lines) {
    if (seen.has(line)) continue;
    seen.add(line);
    unique.push(line);
  }

  // Convertit chaque ligne
  allResults = unique
    .map((raw) => {
      const parsed = parseUrl(raw);
      if (!parsed) return { raw, status: 'err', filename: '', directUrl: null, weservUrl: null };
      return { raw, ...parsed };
    });

  renderResults();
}

// ============================================================================
// RENDU
// ============================================================================
function renderResults() {
  const tbody = document.getElementById('resultsBody');
  const stats = document.getElementById('stats');
  const resultsPanel = document.getElementById('results-panel');
  const emptyPanel = document.getElementById('empty-panel');

  if (!allResults.length) {
    resultsPanel.classList.add('hidden');
    emptyPanel.style.display = 'block';
    stats.textContent = '';
    return;
  }

  resultsPanel.classList.remove('hidden');
  emptyPanel.style.display = 'none';
  tbody.innerHTML = '';

  // Filtre
  const filtered = allResults.filter((r) => {
    if (currentFilter === 'all') return true;
    return r.status === currentFilter;
  });

  for (let i = 0; i < filtered.length; i++) {
    const r = filtered[i];
    const tr = document.createElement('tr');
    tr.dataset.status = r.status;

    // Cellule aperçu
    const previewCell = document.createElement('td');
    previewCell.className = 'preview-cell';
    if (r.weservUrl) {
      const img = document.createElement('img');
      img.src = r.weservUrl; // weserv pour éviter hotlink block
      img.alt = '';
      img.loading = 'lazy';
      img.title = r.filename;
      img.onerror = () => { img.style.opacity = '0.2'; img.title = 'Image indisponible'; };
      previewCell.appendChild(img);
    } else {
      previewCell.textContent = '—';
    }
    tr.appendChild(previewCell);

    // Nom de fichier
    const fnCell = document.createElement('td');
    fnCell.className = 'url-cell';
    fnCell.innerHTML = `<div class="val">${escapeHtml(r.filename || '—')}</div>`;
    tr.appendChild(fnCell);

    // URL directe
    const directCell = document.createElement('td');
    directCell.className = 'url-cell';
    if (r.directUrl) {
      const cls = r.status === 'ok' ? 'ok' : 'warn';
      directCell.innerHTML = `<div class="val ${cls}">${escapeHtml(r.directUrl)}</div>`;
    } else {
      directCell.innerHTML = `<div class="val err">${escapeHtml(r.raw)}</div>`;
    }
    tr.appendChild(directCell);

    // URL weserv
    const weservCell = document.createElement('td');
    weservCell.className = 'url-cell';
    if (r.weservUrl) {
      weservCell.innerHTML = `<div class="val">${escapeHtml(r.weservUrl)}</div>`;
    } else {
      weservCell.innerHTML = `<div class="val err">—</div>`;
    }
    tr.appendChild(weservCell);

    // Actions : 2 boutons copier
    const actionsCell = document.createElement('td');
    if (r.directUrl) {
      actionsCell.innerHTML = `
        <button class="btn-mini" data-copy="${escapeAttr(r.directUrl)}" title="Copier l'URL directe">📋 Direct</button>
        <button class="btn-mini" data-copy="${escapeAttr(r.weservUrl)}" title="Copier l'URL weserv">📋 Weserv</button>
      `;
    } else {
      actionsCell.textContent = '—';
    }
    tr.appendChild(actionsCell);

    tbody.appendChild(tr);
  }

  // Stats
  const ok = allResults.filter((r) => r.status === 'ok').length;
  const warn = allResults.filter((r) => r.status === 'warn').length;
  const err = allResults.filter((r) => r.status === 'err').length;
  stats.innerHTML = `
    ${allResults.length} URL${allResults.length > 1 ? 's' : ''} traitée${allResults.length > 1 ? 's' : ''}
    · <span class="ok">${ok} OK</span>
    · <span class="warn">${warn} fallback</span>
    · <span class="err">${err} invalide${err > 1 ? 's' : ''}</span>
  `;

  // (Re)binde les boutons copier
  tbody.querySelectorAll('button[data-copy]').forEach((btn) => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.copy).then(() => {
        const original = btn.textContent;
        btn.textContent = '✅ Copié';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1200);
      });
    });
  });
}

// ============================================================================
// FILTRES
// ============================================================================
document.querySelectorAll('.filter').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderResults();
  });
});

// ============================================================================
// BOUTONS D'ACTION
// ============================================================================
document.getElementById('convertBtn').addEventListener('click', processInput);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('input').value = '';
  allResults = [];
  renderResults();
});
document.getElementById('exampleBtn').addEventListener('click', () => {
  document.getElementById('input').value = `https://ms.yugipedia.com/0/09/NaturalSelection-OW.png
https://yugipedia.com/wiki/Special:Redirect/file/Excalibur-OW.png
https://yugipedia.com/wiki/File:SpellbindingIllusion-JP-Manga-R-CA.png
File.png
https://exemple.com/image.png`;
  processInput();
});

// Copier toutes les URLs directes (une par ligne)
document.getElementById('copyAllDirect').addEventListener('click', () => {
  const urls = allResults.filter((r) => r.directUrl).map((r) => r.directUrl).join('\n');
  navigator.clipboard.writeText(urls).then(() => {
    const btn = document.getElementById('copyAllDirect');
    const orig = btn.textContent;
    btn.textContent = '✅ Copié !';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
});

document.getElementById('copyAllWeserv').addEventListener('click', () => {
  const urls = allResults.filter((r) => r.weservUrl).map((r) => r.weservUrl).join('\n');
  navigator.clipboard.writeText(urls).then(() => {
    const btn = document.getElementById('copyAllWeserv');
    const orig = btn.textContent;
    btn.textContent = '✅ Copié !';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
});

// Export .txt
document.getElementById('exportTxt').addEventListener('click', () => {
  const lines = allResults.map((r) => {
    return [
      `# ${r.filename}`,
      `direct: ${r.directUrl || '—'}`,
      `weserv: ${r.weservUrl || '—'}`,
      '',
    ].join('\n');
  }).join('\n');
  downloadFile('urls-images.txt', lines, 'text/plain');
});

// Export .json (utile pour patch-images.js)
document.getElementById('exportJson').addEventListener('click', () => {
  const obj = {};
  for (const r of allResults) {
    if (r.filename && r.directUrl) {
      // Clé = nom de fichier sans extension, normalisé
      const key = r.filename.replace(/\.[a-z0-9]+$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      obj[key] = r.directUrl;
    }
  }
  downloadFile('patch-images.json', JSON.stringify(obj, null, 2), 'application/json');
});

// ============================================================================
// UTILITAIRES
// ============================================================================
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;');
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>

</body>
</html>
