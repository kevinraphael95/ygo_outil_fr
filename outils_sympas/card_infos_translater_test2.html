<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>YGOPRO Archétypes — Traducteur Officiel TCG v7</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         max-width: 1100px; margin: 0 auto; padding: 20px;
         background: #f5f6f8; color: #1a1a1a; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .panel { background: #fff; border: 1px solid #e0e4e8; border-radius: 10px;
           padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; height: 160px; font-family: 'SF Mono', Consolas, monospace;
             font-size: 12px; padding: 10px; border: 1px solid #d0d5dc;
             border-radius: 8px; resize: vertical; }
  select, input[type="file"] { padding: 9px 12px; border: 1px solid #d0d5dc; border-radius: 8px;
           font-size: 14px; font-family: inherit; background: #fff; color: inherit; }
  button { padding: 10px 18px; background: #4a7fd6; color: #fff; border: none;
           border-radius: 8px; font-size: 14px; font-weight: 600;
           cursor: pointer; font-family: inherit; }
  button:hover:not(:disabled) { background: #3a6fc6; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #fff; color: #555; border: 1px solid #d0d5dc; }
  button.secondary:hover:not(:disabled) { background: #f7f8fa; border-color: #4a7fd6; color: #4a7fd6; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .progress { flex: 1; height: 8px; background: #eef0f4; border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; background: #4a7fd6; width: 0%; transition: width .2s; }
  .stats { font-size: 13px; color: #555; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px;
          font-family: 'SF Mono', Consolas, monospace; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #eef0f4; }
  th { background: #f7f8fa; font-weight: 700; font-size: 11px;
       text-transform: uppercase; letter-spacing: .5px; color: #777;
       position: sticky; top: 0; }
  tr.ok td:nth-child(3) { color: #1a7a3a; font-weight: 600; }
  tr.miss td:nth-child(3) { color: #c0392b; font-style: italic; }
  .table-wrap { max-height: 400px; overflow: auto; border: 1px solid #e0e4e8;
                border-radius: 8px; }
</style>
</head>
<body>

<h1>YGOPRO — Traducteur d'archétypes <span style="font-size:12px;color:#888;">v7 · Officiel TCG</span></h1>
<div class="sub">
  Récupère automatiquement les traductions officielles TCG depuis Yugipedia avec fallback de recherche multi-source.
</div>

<div class="panel">
  <div class="row">
    <strong>🌐 Langue cible</strong>
    <select id="langSelect">
      <option value="french">Français (TCG Official)</option>
      <option value="german">Deutsch</option>
      <option value="spanish">Español</option>
      <option value="italian">Italiano</option>
    </select>
  </div>
</div>

<div class="panel">
  <div class="row" style="margin-bottom:10px;">
    <strong>📄 Fichier cardinfo_english.txt</strong>
    <input type="file" id="fileInput" accept=".txt">
  </div>
  <textarea id="input" placeholder="Colle ton cardinfo_english.txt ici…"></textarea>
  <div class="stats" id="parseStats"></div>
</div>

<div class="panel">
  <div class="row">
    <button id="startBtn">▶ Lancer la traduction officielle</button>
    <button id="exportBtn" class="secondary" disabled>⬇ Exporter cardinfo_fr_setname.txt</button>
    <button id="stopBtn" class="secondary" disabled>⏹ Stop</button>
  </div>
  <div class="row" style="margin-top:12px;">
    <div class="progress"><div id="bar"></div></div>
    <span id="counter" style="font-size:12px;color:#666;min-width:80px;text-align:right;">0 / 0</span>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="panel">
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Hex</th><th>Nom EN</th><th>Traduction Officielle</th><th>Statut</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const YUGIPEDIA_API = 'https://yugipedia.com/api.php';
const CONCURRENCY = 4;
const BATCH_DELAY_MS = 200;

const LANGS = {
  french: { field: 'fr_name', ext: 'fr' },
  german: { field: 'de_name', ext: 'de' },
  spanish: { field: 'es_name', ext: 'es' },
  italian: { field: 'it_name', ext: 'it' }
};

let parsedEntries = [];
let results = [];
let stopRequested = false;

function parseSetname(text) {
  const lines = text.split('\n');
  const entries = [];
  let inSetname = false;
  for (const raw of lines) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('##')) { inSetname = line.trim() === '##setname'; continue; }
    if (line.trim() === '#end') break;
    if (!inSetname || !line.trim()) continue;
    const m = line.match(/^(-?\d+|0x[0-9a-fA-F]+)[\t ]+(.+)$/);
    if (!m) continue;
    entries.push({ hex: m[1], label: m[2].trim() });
  }
  return entries;
}

function extractLang(wikitext) {
  if (!wikitext) return null;
  const cfg = LANGS[document.getElementById('langSelect').value];
  const re = new RegExp(`\\|\\s*${cfg.field}\\s*=\\s*([^\\n|]+)`, 'i');
  const m = wikitext.match(re);
  if (!m) return null;
  let val = m[1].trim()
    .replace(/\[\[([^\]\vert{}]+)\Vert{}([^\]]+)\]\]/g, '$2')
    .replace(/\[\[([^\]]+)\]\]/g, '$1')
    .replace(/<ref[^>]*>.*?<\/ref>/gi, '')
    .split('\n')[0].trim().replace(/''/g, '');
  return (val && val !== '—' && val !== '-') ? val : null;
}

async function fetchWikitext(pageTitle) {
  const params = new URLSearchParams({
    action: 'parse', format: 'json', origin: '*',
    page: pageTitle, prop: 'wikitext', redirects: '1'
  });
  try {
    const res = await fetch(`${YUGIPEDIA_API}?${params}`);
    const data = await res.json();
    return data?.parse?.wikitext?.['*'] || null;
  } catch (e) {
    return null;
  }
}

async function runScraping() {
  stopRequested = false;
  results = [];
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('exportBtn').disabled = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;

  const total = parsedEntries.length;
  let done = 0, translated = 0, missing = 0;

  const rowMap = {};
  for (const entry of parsedEntries) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${entry.hex}</td><td>${entry.label}</td><td style="color:#a0a0b0;">…</td><td>en attente</td>`;
    tbody.appendChild(tr);
    rowMap[entry.hex] = tr;
  }

  for (const entry of parsedEntries) {
    if (stopRequested) break;
    const tr = rowMap[entry.hex];
    let wt = await fetchWikitext(entry.label);
    let val = extractLang(wt);

    // Tentative de fallback si la page directe ne donne rien
    if (!val) {
      wt = await fetchWikitext(`${entry.label} (archetype)`);
      val = extractLang(wt);
    }

    if (val) {
      translated++;
      tr.className = 'ok';
      tr.children[2].textContent = val;
      tr.children[3].textContent = 'officiel';
      results.push({ hex: entry.hex, label: entry.label, tr: val });
    } else {
      missing++;
      tr.className = 'miss';
      tr.children[2].textContent = entry.label; // garde EN en cas d'absence
      tr.children[3].textContent = 'non trouvé';
      results.push({ hex: entry.hex, label: entry.label, tr: entry.label });
    }

    done++;
    document.getElementById('bar').style.width = (done / total * 100) + '%';
    document.getElementById('counter').textContent = `${done} / ${total}`;
    document.getElementById('stats').textContent = `✅ ${translated} traduits · ⚠️ ${missing} non trouvés`;
    await new Promise(r => setTimeout(r, BATCH_DELAY_MS));
  }

  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('exportBtn').disabled = false;
}

function buildFile() {
  const lines = ['################ use tab', '##setname'];
  for (const r of results) {
    lines.push(`${r.hex}\t${r.tr}`);
  }
  lines.push('#end');
  return lines.join('\n');
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  document.getElementById('input').value = text;
  parsedEntries = parseSetname(text);
  document.getElementById('parseStats').textContent = `📊 ${parsedEntries.length} archétypes détectés.`;
});

document.getElementById('startBtn').addEventListener('click', () => {
  const text = document.getElementById('input').value;
  parsedEntries = parseSetname(text);
  if (parsedEntries.length) runScraping();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([buildFile()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cardinfo_fr_setname.txt';
  a.click();
});
</script>
</body>
</html>
