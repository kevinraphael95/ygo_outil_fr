<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XML → YDK · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   YGO Tools — Design system commun
   ============================================================ */

/* ---------- Tokens ---------- */
:root,
[data-theme="dark"] {
    color-scheme: dark;
    --bg:            #0d0a1a;
    --bg-glow:       rgba(212, 175, 55, 0.05);
    --surface:       #16112a;
    --surface-2:     #1f1838;
    --surface-3:     #2a2148;
    --border:        #3a2d5c;
    --border-strong: #4d3d75;
    --text:          #f5ecd8;
    --text-muted:    #a89b82;
    --text-dim:      #7a705c;
    --gold:          #d4af37;
    --gold-light:    #e8c85a;
    --gold-dark:     #a67c00;
    --gold-soft:     rgba(212, 175, 55, 0.12);
    --gold-glow:     rgba(212, 175, 55, 0.35);
    --success:       #5fd07f;
    --success-soft:  rgba(95, 208, 127, 0.13);
    --warning:       #e0b64c;
    --warning-soft:  rgba(224, 182, 76, 0.13);
    --danger:        #e07a7a;
    --danger-soft:   rgba(224, 122, 122, 0.13);
    --info:          #b88ae0;
    --info-soft:     rgba(155, 107, 196, 0.15);
    --shadow-sm:     0 1px 3px rgba(0,0,0,.5);
    --shadow-md:     0 6px 24px rgba(0,0,0,.5);
    --shadow-lg:     0 18px 50px rgba(0,0,0,.7);
    --code-bg:       #0a0715;
}

[data-theme="light"] {
    color-scheme: light;
    --bg:            #f0e8d8;
    --bg-glow:       rgba(166, 124, 0, 0.07);
    --surface:       #faf5e8;
    --surface-2:     #f2ebd9;
    --surface-3:     #e8dfc5;
    --border:        #d9cdb4;
    --border-strong: #bcab88;
    --text:          #2a1f14;
    --text-muted:    #6b5d47;
    --text-dim:      #94856a;
    --gold:          #a67c00;
    --gold-light:    #c49616;
    --gold-dark:     #7a5a00;
    --gold-soft:     rgba(166, 124, 0, 0.10);
    --gold-glow:     rgba(166, 124, 0, 0.28);
    --success:       #1f8a3d;
    --success-soft:  rgba(31, 138, 61, 0.11);
    --warning:       #8f6a00;
    --warning-soft:  rgba(166, 124, 0, 0.12);
    --danger:        #c33a3a;
    --danger-soft:   rgba(195, 58, 58, 0.10);
    --info:          #6a3a9a;
    --info-soft:     rgba(106, 58, 154, 0.10);
    --shadow-sm:     0 1px 2px rgba(60,40,10,.08);
    --shadow-md:     0 6px 20px rgba(60,40,10,.12);
    --shadow-lg:     0 18px 50px rgba(60,40,10,.2);
    --code-bg:       #f6f0df;
}

:root {
    --radius:      16px;
    --radius-sm:   10px;
    --font-display: 'Cinzel', Georgia, serif;
    --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease:         cubic-bezier(.2, .7, .3, 1);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    background-color: var(--bg);
    background-image:
        radial-gradient(circle at 15% 0%,   var(--bg-glow) 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, var(--bg-glow) 0%, transparent 45%);
    background-attachment: fixed;
    transition: background-color .3s var(--ease), color .3s var(--ease);
    display: flex;
    flex-direction: column;
}
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-light); text-decoration: underline; }
code, kbd, pre { font-family: var(--font-mono); }
code {
    background: var(--gold-soft);
    color: var(--gold-light);
    padding: 1px 7px;
    border-radius: 6px;
    font-size: .88em;
}
[data-theme="light"] code { color: var(--gold-dark); }
kbd {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-size: .85em;
}
::selection { background: var(--gold-glow); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--text-muted); }
.dim   { color: var(--text-dim); }
.mono  { font-family: var(--font-mono); }

/* Scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }

/* ---------- Header ---------- */
.app-header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 var(--gold-soft), var(--shadow-sm);
}
.app-header-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; color: inherit; }
.brand:hover { text-decoration: none; color: inherit; }
.brand-logo {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    font-size: 1.15rem; color: #1a1408;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    box-shadow: 0 0 18px var(--gold-glow);
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--gold); letter-spacing: .02em; line-height: 1.1; }
.brand-sub  { font-size: 11.5px; color: var(--text-muted); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    cursor: pointer; font-size: 1rem;
    transition: all .18s var(--ease);
}
.icon-btn:hover { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); text-decoration: none; transform: translateY(-1px); }

/* ---------- Layout ---------- */
.container { width: 100%; max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; flex: 1; }
.container.wide { max-width: 1240px; }
.app-footer { text-align: center; padding: 22px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); }

.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
.hero-icon {
    flex: none; width: 58px; height: 58px; border-radius: 16px;
    display: grid; place-items: center; font-size: 1.6rem; color: var(--gold);
    background: var(--gold-soft); border: 1px solid var(--gold);
    box-shadow: 0 0 24px var(--gold-soft);
}
.hero h1 { font-family: var(--font-display); font-size: clamp(1.35rem, 3.4vw, 1.9rem); line-height: 1.2; margin: 0 0 4px; font-weight: 700; }
.hero p  { margin: 0; color: var(--text-muted); max-width: 70ch; }
.grad {
    background: linear-gradient(90deg, var(--gold-light), var(--gold) 50%, var(--info));
    -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- Cards ---------- */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
}
.card-title {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-size: 1.02rem; font-weight: 700;
    color: var(--gold); margin: 0 0 6px;
}
.card-sub { margin: 0 0 18px; color: var(--text-muted); font-size: 13.5px; }
.card-title + .field, .card-title + .grid-2 { margin-top: 14px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field > label, .label { font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--text-dim); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.row + .row { margin-top: 12px; }
.row > .grow { flex: 1; min-width: 160px; }
.inline-field { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.inline-field > label { min-width: 190px; font-size: 13px; font-weight: 600; }

input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font: inherit; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
}
.inline-field input[type="text"], .inline-field input[type="number"], .inline-field select { width: auto; min-width: 120px; }
textarea { min-height: 150px; resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
input[type="file"] {
    width: 100%; padding: 6px; border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm); background: var(--surface-2);
    color: var(--text-muted); font: inherit; font-size: 13px; cursor: pointer;
}
input[type="file"]::file-selector-button {
    margin-right: 12px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--gold); border-radius: 8px;
    background: var(--gold-soft); color: var(--gold); font: 600 13px var(--font-body);
    transition: background .15s;
}
input[type="file"]::file-selector-button:hover { background: var(--gold-glow); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }

/* ---------- Buttons ---------- */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface-2); color: var(--text);
    font: 600 14px/1.1 var(--font-body); white-space: nowrap;
    cursor: pointer; text-decoration: none;
    transition: all .18s var(--ease);
}
.btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); transform: translateY(-1px); text-decoration: none; }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary {
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    color: #1a1408; border-color: var(--gold);
    box-shadow: 0 2px 14px var(--gold-glow);
}
.btn-primary:hover:not(:disabled) { color: #1a1408; background: linear-gradient(135deg, #f3d77a, var(--gold-light)); box-shadow: 0 4px 20px var(--gold-glow); }
.btn-danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-copied { border-color: var(--success) !important; color: var(--success) !important; background: var(--success-soft) !important; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

/* Onglets / filtres */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
    padding: 7px 14px; border-radius: 999px; font: 600 12.5px var(--font-body);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
    cursor: pointer; transition: all .15s;
}
.tab:hover { color: var(--gold); border-color: var(--gold); }
.tab.active { background: var(--gold); color: #1a1408; border-color: var(--gold); }

/* ---------- Progress ---------- */
.progress { margin-top: 18px; }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 7px; }
.progress-bar { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
    box-shadow: 0 0 12px var(--gold-glow);
    transition: width .35s var(--ease);
}

/* ---------- Console ---------- */
.console {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; height: 240px; overflow-y: auto;
    font: 12.5px/1.65 var(--font-mono); color: var(--text-muted);
}
.console-line { white-space: pre-wrap; word-break: break-word; }
.console-line .t { color: var(--text-dim); margin-right: 8px; }
.console-line.info .m { color: var(--text); }
.console-line.ok   .m { color: var(--success); }
.console-line.warn .m { color: var(--warning); }
.console-line.err  .m { color: var(--danger); }

/* ---------- Alertes / puces ---------- */
.alert {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 16px; margin: 14px 0; border-radius: 12px;
    border: 1px solid var(--border); border-left-width: 4px;
    background: var(--surface-2); font-size: 14px;
}
.alert > i { margin-top: 3px; }
.alert.info { border-left-color: var(--info);    background: var(--info-soft); }
.alert.ok   { border-left-color: var(--success); background: var(--success-soft); }
.alert.warn { border-left-color: var(--warning); background: var(--warning-soft); }
.alert.err  { border-left-color: var(--danger);  background: var(--danger-soft); }
.alert p { margin: 0; }

.stats { margin-top: 12px; font-size: 13px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-3); border: 1px solid var(--border); }
.chip.ok   { color: var(--success); background: var(--success-soft); border-color: transparent; }
.chip.warn { color: var(--warning); background: var(--warning-soft); border-color: transparent; }
.chip.err  { color: var(--danger);  background: var(--danger-soft);  border-color: transparent; }

/* ---------- Dropzone ---------- */
.dropzone {
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    padding: 38px 20px; cursor: pointer;
    border: 2px dashed var(--border-strong); border-radius: var(--radius);
    background: var(--surface-2); color: var(--text-muted);
    transition: all .2s var(--ease);
}
.dropzone:hover, .dropzone.over { border-color: var(--gold); background: var(--gold-soft); color: var(--text); transform: scale(1.005); }
.dropzone i { font-size: 2.1rem; color: var(--gold); }
.dropzone strong { color: var(--text); }

/* ---------- Tableaux ---------- */
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
    position: sticky; top: 0; z-index: 1; text-align: left;
    padding: 11px 14px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--gold); background: var(--surface-3); border-bottom: 1px solid var(--border-strong);
}
td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--gold-soft); }
tr.ok   td:first-child { box-shadow: inset 3px 0 var(--success); }
tr.miss td:first-child { box-shadow: inset 3px 0 var(--warning); }
tr.miss td:nth-child(3) { color: var(--text-muted); }
.val { max-width: 340px; font: 12px var(--font-mono); word-break: break-all; color: var(--text-muted); }
.val.ok { color: var(--success); } .val.warn { color: var(--warning); } .val.err { color: var(--danger); }
.preview-cell img { width: 40px; height: 40px; object-fit: contain; border-radius: 6px; background: var(--surface-3); display: block; }
.empty { text-align: center; padding: 34px 10px; color: var(--text-muted); }
.empty i { display: block; font-size: 1.8rem; margin-bottom: 10px; color: var(--text-dim); }

.result-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; max-height: 280px; overflow: auto; }
.result-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font: 12.5px var(--font-mono); }

/* ---------- Tutoriel ---------- */
.step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.step h2, .prose h2 { font-family: var(--font-display); font-size: 1.1rem; color: var(--gold); margin: 0 0 14px; display: flex; align-items: center; gap: 12px; }
.num {
    flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font: 700 .9rem var(--font-body); color: #1a1408;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
}
.step ol { padding-left: 22px; margin: 0 0 12px; display: grid; gap: 8px; }
.step ol li::marker { color: var(--gold); font-weight: 700; }
.step p { margin: 8px 0; }
.prose { margin-top: 36px; }
.prose h2 { margin-top: 28px; }
.prose h3 { font-size: .98rem; margin: 20px 0 6px; color: var(--text); }
.prose p { margin: 4px 0; color: var(--text-muted); }
.code-block { position: relative; margin: 12px 0; }
.code-block pre {
    margin: 0; padding: 16px 18px; overflow: auto; font-size: 12.5px; line-height: 1.6;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
}
.code-block pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
.code-block .copy { position: absolute; top: 10px; right: 10px; }
.final {
    text-align: center; padding: 28px; margin: 22px 0; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--gold-soft), var(--info-soft)); border: 1px solid var(--gold);
}
.final a { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.35rem); font-weight: 700; word-break: break-all; }

/* ---------- Accueil ---------- */
.tool-section { margin: 30px 0 12px; font: 700 .78rem var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.tool-card {
    display: flex; flex-direction: column; gap: 10px; padding: 20px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); transition: all .2s var(--ease);
}
.tool-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: var(--shadow-md), 0 0 0 1px var(--gold-soft); text-decoration: none; color: var(--text); }
.tool-card .hero-icon { width: 46px; height: 46px; font-size: 1.2rem; border-radius: 13px; }
.tool-card h3 { margin: 0; font-family: var(--font-display); font-size: 1rem; color: var(--gold); }
.tool-card p { margin: 0; font-size: 13.5px; color: var(--text-muted); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
    display: flex; align-items: center; gap: 10px; max-width: min(380px, calc(100vw - 44px));
    padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-left: 4px solid var(--success);
    box-shadow: var(--shadow-lg); pointer-events: auto;
    animation: toastIn .3s var(--ease);
}
.toast.err { border-left-color: var(--danger); }
.toast.ok > i { color: var(--success); } .toast.err > i { color: var(--danger); }
.toast.out { opacity: 0; transform: translateX(30px); transition: all .3s var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

/* ---------- Responsive / accessibilité ---------- */
@media (max-width: 640px) {
    .app-header-inner { padding: 10px 14px; }
    .brand-sub { display: none; }
    .container { padding: 22px 14px 48px; }
    .hero { align-items: flex-start; }
    .hero-icon { width: 48px; height: 48px; font-size: 1.3rem; }
    .card, .step { padding: 16px; }
    .inline-field > label { min-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
<script>
/* ============================================================
   YGO Tools — utilitaires communs (thème, toasts, console, I/O)
   Chargé dans le <head> pour appliquer le thème avant l'affichage.
   ============================================================ */
(function () {
    'use strict';

    const KEY = 'ygo_theme';
    const root = document.documentElement;

    /* ---------- Thème ---------- */
    function preferred() {
        try {
            const saved = localStorage.getItem(KEY);
            if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) { /* stockage indisponible */ }
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        if (btn) {
            btn.innerHTML = theme === 'dark'
                ? '<i class="fa-solid fa-moon"></i>'
                : '<i class="fa-solid fa-sun"></i>';
            btn.title = theme === 'dark' ? 'Passer en thème clair' : 'Passer en thème sombre';
            btn.setAttribute('aria-label', btn.title);
        }
    }

    applyTheme(preferred());

    document.addEventListener('DOMContentLoaded', () => {
        applyTheme(root.getAttribute('data-theme'));
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (e) { /* ignore */ }
            applyTheme(next);
        });
    });

    window.addEventListener('storage', (e) => {
        if (e.key === KEY && (e.newValue === 'dark' || e.newValue === 'light')) applyTheme(e.newValue);
    });

    /* ---------- API ---------- */
    const YGO = {};

    YGO.$ = (id) => document.getElementById(id);
    YGO.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /** Création rapide d'éléments DOM (texte toujours échappé). */
    YGO.el = function (tag, props, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
            if (v == null || v === false) continue;
            if (k === 'className') node.className = v;
            else if (k === 'text') node.textContent = v;
            else if (k === 'dataset') Object.assign(node.dataset, v);
            else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
            else node.setAttribute(k, v === true ? '' : v);
        }
        for (const c of children.flat()) {
            if (c == null || c === false) continue;
            node.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
        return node;
    };

    YGO.fmtBytes = function (n) {
        if (n < 1024) return n + ' o';
        if (n < 1048576) return (n / 1024).toFixed(1) + ' Ko';
        return (n / 1048576).toFixed(2) + ' Mo';
    };

    /** Toast : type 'ok' | 'err'. */
    YGO.toast = function (message, type = 'ok') {
        let box = document.getElementById('toasts');
        if (!box) {
            box = YGO.el('div', { className: 'toasts', id: 'toasts', 'aria-live': 'polite' });
            document.body.append(box);
        }
        const t = YGO.el('div', { className: 'toast ' + type, role: 'status' },
            YGO.el('i', { className: 'fa-solid ' + (type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation') }),
            YGO.el('span', { text: message }));
        box.append(t);
        setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3600);
    };

    /** Console d'exécution. level : 'info' | 'ok' | 'warn' | 'err'. */
    YGO.console = function (el) {
        return {
            log(msg, level = 'info') {
                const time = new Date().toLocaleTimeString('fr-FR');
                el.append(YGO.el('div', { className: 'console-line ' + level },
                    YGO.el('span', { className: 't', text: '[' + time + ']' }),
                    YGO.el('span', { className: 'm', text: msg })));
                while (el.childElementCount > 3000) el.firstElementChild.remove();
                el.scrollTop = el.scrollHeight;
            },
            clear() { el.textContent = ''; },
        };
    };

    /** Barre de progression : root contient .progress-text / .progress-percent / .progress-fill. */
    YGO.progress = function (root) {
        const fill = root.querySelector('.progress-fill');
        const pct = root.querySelector('.progress-percent');
        const txt = root.querySelector('.progress-text');
        return {
            show() { root.classList.remove('hidden'); },
            hide() { root.classList.add('hidden'); },
            set(value, text) {
                const v = Math.max(0, Math.min(100, Math.round(value)));
                fill.style.width = v + '%';
                if (pct) pct.textContent = v + '%';
                if (txt && text != null) txt.textContent = text;
            },
        };
    };

    /** Télécharge une chaîne, un Blob ou un Uint8Array. */
    YGO.download = function (data, filename, mime = 'application/octet-stream') {
        const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = YGO.el('a', { href: url, download: filename });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        return blob.size;
    };

    /** Copie dans le presse-papiers (avec repli pour les contextes non sécurisés). */
    YGO.copy = async function (text, okMessage = 'Copié dans le presse-papiers !') {
        try {
            await navigator.clipboard.writeText(text);
        } catch (e) {
            const ta = YGO.el('textarea', { style: 'position:fixed;opacity:0' });
            ta.value = text;
            document.body.append(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
        }
        if (okMessage) YGO.toast(okMessage);
    };

    /** Affiche "N fichier(s)" sous un champ fichier / dossier. */
    YGO.bindFileCount = function (input, hintEl, pattern) {
        input.addEventListener('change', () => {
            const files = [...input.files];
            const n = pattern ? files.filter((f) => pattern.test(f.name)).length : files.length;
            hintEl.textContent = n ? n.toLocaleString('fr-FR') + ' fichier(s) retenu(s)' : '';
        });
    };

    /** Initialise sql.js (le script sql-wasm.js doit être chargé). */
    YGO.initSql = () => initSqlJs({
        locateFile: (f) => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f,
    });

    window.YGO = YGO;
})();

</script>
<style>
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .deck { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); padding: 14px 16px; margin-bottom: 12px; }
    .deck h3 { margin: 0 0 4px; font-size: 1.02rem; }
    .deck .stats { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
    .deck .ok { color: var(--success); font-weight: 600; }
    .deck .ko { color: var(--danger); font-weight: 600; }
    .miss { font: 12.5px var(--font-mono); color: var(--text-muted); background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
</style>
</head>
<body>

<button class="icon-btn" id="theme-toggle" type="button" style="position:fixed;top:14px;right:14px;z-index:60;"></button>

<main class="container wide">
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-file-export"></i></div>
        <div>
            <h1>Deck XML → <span class="grad">YDK</span></h1>
            <p>Glisse tes decks .xml : les ID sont retrouvés par le nom dans tes .cdb (VAACT compris) et tu récupères des .ydk prêts pour EDOPro.</p>
        </div>
    </section>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-folder-open"></i> 1. Fichiers .cdb</h2>
        <div class="row">
            <button class="btn btn-primary" id="loadBtn" type="button"><i class="fa-solid fa-bolt"></i> Charger ProjectIgnis</button>
            <button class="btn" id="changeBtn" type="button" title="Choisir un autre dossier ProjectIgnis"><i class="fa-solid fa-folder-tree"></i> Changer de dossier</button>
            <button class="btn" id="clearBtn" type="button"><i class="fa-solid fa-trash"></i> Tout vider</button>
        </div>
        
        <!-- OPTION MODIFIÉE ICI -->
        <div class="row" style="margin-top:10px; margin-bottom: 10px;">
            <label class="check">
                <input type="checkbox" id="optPreferCustom" checked>
                <span>Ignorer les cartes officielles (ne garder <strong>que</strong> les cartes custom VAACT)</span>
            </label>
        </div>

        <details id="manual" style="margin-bottom:10px;">
            <summary class="hint" style="cursor:pointer;">Autre méthode (Firefox ou dossiers à la main)</summary>
            <div class="row" style="margin-top:8px;">
                <label for="folderInput" class="btn"><i class="fa-solid fa-folder-plus"></i> Ajouter un dossier</label>
                <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden">
                <label for="fileInput" class="btn"><i class="fa-solid fa-file-circle-plus"></i> Ajouter des .cdb</label>
                <input type="file" id="fileInput" accept=".cdb" multiple class="hidden">
            </div>
        </details>
        <div class="hint" id="status"></div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-file-code"></i> 2. Decks .xml</h2>
        <label class="dropzone" id="drop" for="xmlInput">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span><strong>Glisse tes .xml ici</strong> ou clique pour les choisir</span>
        </label>
        <input type="file" id="xmlInput" accept=".xml" multiple class="hidden">
        <div class="row" style="margin-top:14px;">
            <button class="btn btn-primary" id="allBtn" type="button" disabled><i class="fa-solid fa-download"></i> Tout télécharger (.ydk)</button>
        </div>
        <div id="decks"></div>
    </div>
</main>

<div class="toasts" id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
const { $ } = YGO;
// ===== CONFIG (tout se règle ici) =====
const CONFIG = {
    BASE: 'C:\\ProjectIgnis',                           // dossier à choisir UNE fois (le navigateur s'en souvient)
    SEARCH_PATHS: ['expansions', 'config/languages'],   // sous-dossiers de BASE lus (récursif)
    EXCLUDE_DIRS: ['.git', 'node_modules'],
    AUTO_LOAD: true,
    CUSTOM_MIN_ID: 900000000,                           // les cartes custom (VAACT = 910000000+) sont préférées pour un nom sans passcode
};
// Extra Deck : fusion, synchro, xyz, link
const EXTRA_MASK = 0x40 | 0x2000 | 0x800000 | 0x4000000;

let SQL = null;
const byName = new Map();   // nom normalisé -> Set(id)
const types = new Map();    // id -> type (colonne datas.type)
const loaded = new Set();
let nbCdb = 0;
const results = [];         // [{filename, ydk}]

const sqlReady = YGO.initSql().then((s) => { SQL = s; }).catch((e) => setStatus('Impossible de charger sql.js : ' + e.message));
const setStatus = (t) => { $('status').textContent = t; };
const tick = () => new Promise((r) => setTimeout(r, 0));
const norm = (s) => String(s || '').normalize('NFD').toLowerCase().replace(/\p{M}/gu, '').replace(/[^\p{L}\p{N}]/gu, '');
const stripTag = (s) => String(s || '').replace(/\s*\((buff|nerf)\)\s*$/i, '');

async function addFiles(items) {
    await sqlReady;
    if (!SQL) return;
    const files = items.filter((x) => /\.cdb$/i.test(x.file.name));
    if (!files.length) return YGO.toast('Aucun .cdb trouvé.', 'err');
    let added = 0, bad = 0;
    for (const { file: f, rel } of files) {
        if (loaded.has(rel)) continue;
        setStatus(`Lecture de ${rel}…`);
        try {
            const db = new SQL.Database(new Uint8Array(await f.arrayBuffer()));
            const t = db.exec('SELECT id, name FROM texts');
            for (const [id, name] of (t.length ? t[0].values : [])) {
                const n = norm(name);
                if (!n) continue;
                if (!byName.has(n)) byName.set(n, new Set());
                byName.get(n).add(id);
            }
            try {   // les .cdb de langue n'ont pas toujours la table datas
                const d = db.exec('SELECT id, type FROM datas');
                for (const [id, type] of (d.length ? d[0].values : [])) types.set(id, type);
            } catch (e) { /* pas de datas */ }
            db.close();
            loaded.add(rel); nbCdb++; added++;
        } catch (e) { bad++; }
        await tick();
    }
    setStatus(`${nbCdb} .cdb lus · ${byName.size.toLocaleString('fr-FR')} noms de cartes` + (bad ? ` · ${bad} fichier(s) ignoré(s)` : '') + '.');
    YGO.toast(`${added} .cdb ajoutés.`);
}

const asItems = (l) => l.map((f) => ({ file: f, rel: f.webkitRelativePath || f.name }));
$('folderInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; addFiles(asItems(l)); });
$('fileInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; addFiles(asItems(l)); });
$('clearBtn').addEventListener('click', () => {
    byName.clear(); types.clear(); loaded.clear(); nbCdb = 0;
    setStatus('Tout est vidé.');
});

/** ID d'une carte du XML : passcode si présent, sinon recherche par nom dans les .cdb. */
function findId(cardEl, deckAverageId) {
    const passcode = (cardEl.getAttribute('passcode') || '').trim();
    const onlyCustom = $('optPreferCustom').checked; 

    // Si on veut UNIQUEMENT du custom, on ignore le passcode et on cherche par nom
    if (!onlyCustom && /^\d+$/.test(passcode) && Number(passcode) > 0) {
        return Number(passcode);
    }
    
    const name = (cardEl.textContent || '').trim();

    for (const candidate of [name, stripTag(name)]) {
        const set = byName.get(norm(candidate));
        if (!set || !set.size) continue;
        
        let ids = [...set];
        
        if (onlyCustom) {
            // On filtre pour ne garder QUE les customs
            ids = ids.filter((id) => id >= CONFIG.CUSTOM_MIN_ID);
            if (!ids.length) return null; // Aucun custom trouvé, on abandonne
            
            // Si on a plusieurs versions custom, on prend celle qui est la plus proche de la moyenne du deck
            if (ids.length > 1 && deckAverageId > 0) {
                ids.sort((a, b) => Math.abs(a - deckAverageId) - Math.abs(b - deckAverageId));
                return ids[0];
            }
            // Sinon on prend la première
            return ids.sort((a, b) => a - b)[0];
        }
        
        // Si l'option n'est pas cochée, on accepte tout
        return ids.sort((a, b) => a - b)[0];
    }
    return null;
}

function convertXml(text, filename) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('XML invalide');
    const deck = doc.documentElement;
    
    // --- Nouvelle étape : calculer l'ID moyen du deck (pour trouver le bon "bloc" d'ID) ---
    let sum = 0, count = 0;
    for (const part of deck.children) {
        for (const c of part.children) {
            const passcode = (c.getAttribute('passcode') || '').trim();
            if (/^\d+$/.test(passcode) && Number(passcode) > CONFIG.CUSTOM_MIN_ID) {
                sum += Number(passcode);
                count++;
            }
        }
    }
    const deckAverageId = count > 0 ? Math.round(sum / count) : 0;

    const sec = { main: [], extra: [], side: [] };
    const missing = [];
    for (const part of deck.children) {
        const tag = part.tagName.toLowerCase();
        if (!(tag in sec)) continue;
        for (const c of part.children) {
            const id = findId(c, deckAverageId);
            if (id == null) missing.push(`(${tag}) ${(c.textContent || '').trim()}`);
            else sec[tag].push(id);
        }
    }
    // Une carte d'Extra Deck rangée dans main (ou l'inverse) est replacée d'après le .cdb
    const main = [], extra = [...sec.extra];
    for (const id of sec.main) (types.has(id) && (types.get(id) & EXTRA_MASK) ? extra : main).push(id);
    const lines = ['#created by xml_to_ydk', '#main', ...main, '#extra', ...extra, '!side', ...sec.side];
    for (const m of missing) lines.push('# INTROUVABLE ' + m);
    return {
        name: deck.getAttribute('name') || filename.replace(/\.xml$/i, ''),
        ydk: lines.join('\n') + '\n',
        counts: { main: main.length, extra: extra.length, side: sec.side.length },
        missing,
    };
}

const safeName = (s) => s.replace(/[\\/:*?"<>|]+/g, '_').trim() || 'deck';

function renderDeck(r, filename) {
    const box = document.createElement('div'); box.className = 'deck';
    const h = document.createElement('h3'); h.textContent = r.name; box.append(h);
    const st = document.createElement('div'); st.className = 'stats';
    const total = r.counts.main + r.counts.extra + r.counts.side;
    st.innerHTML = `Main ${r.counts.main} · Extra ${r.counts.extra} · Side ${r.counts.side} — `
        + (r.missing.length ? `<span class="ko">${r.missing.length} carte(s) introuvable(s)</span>` : '<span class="ok">toutes les cartes trouvées</span>');
    box.append(st);
    if (r.missing.length) {
        const m = document.createElement('div'); m.className = 'miss'; m.textContent = r.missing.join('\n'); box.append(m);
        const hint = document.createElement('div'); hint.className = 'hint';
        hint.textContent = 'Il manque sûrement le .cdb de cette extension : charge ton dossier ProjectIgnis (expansions) puis re-glisse le .xml.';
        box.append(hint);
    }
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn btn-primary btn-sm';
    btn.innerHTML = '<i class="fa-solid fa-download"></i> Télécharger le .ydk';
    btn.disabled = total === 0;
    btn.onclick = () => YGO.download(r.ydk, safeName(filename.replace(/\.xml$/i, '')) + '.ydk', 'text/plain');
    box.append(btn);
    $('decks').append(box);
}

async function handleXml(files) {
    if (!nbCdb) YGO.toast('Aucun .cdb chargé : seules les cartes avec passcode seront trouvées.', 'err');
    $('decks').innerHTML = ''; results.length = 0;
    for (const f of files) {
        if (!/\.xml$/i.test(f.name)) continue;
        try {
            const r = convertXml(await f.text(), f.name);
            results.push({ filename: safeName(f.name.replace(/\.xml$/i, '')) + '.ydk', ydk: r.ydk });
            renderDeck(r, f.name);
        } catch (e) {
            const box = document.createElement('div'); box.className = 'deck';
            box.innerHTML = '<span class="ko"></span>'; box.firstChild.textContent = `${f.name} : ${e.message}`;
            $('decks').append(box);
        }
    }
    $('allBtn').disabled = !results.length;
}

$('xmlInput').addEventListener('change', (e) => { const l = [...e.target.files]; e.target.value = ''; handleXml(l); });
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => handleXml([...e.dataTransfer.files]));
$('allBtn').addEventListener('click', async () => {
    for (const r of results) { YGO.download(r.ydk, r.filename, 'text/plain'); await YGO.sleep(300); }
});

// ===== DOSSIER PROJECTIGNIS MÉMORISÉ (Chrome / Edge) =====
const FS = !!window.showDirectoryPicker;
const kv = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('ygo-cdb-finder', 1);   // même base que le chercheur de cartes : le dossier est partagé
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
        const tx = r.result.transaction('kv', mode), req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => res(req.result); tx.onerror = () => rej(tx.error);
    };
});
const saveHandle = (h) => kv('readwrite', (st) => st.put(h, 'base'));
const getHandle = () => kv('readonly', (st) => st.get('base')).catch(() => null);

async function walk(dir, rel, out) {
    for await (const [name, h] of dir.entries()) {
        if (h.kind === 'directory') { if (!CONFIG.EXCLUDE_DIRS.includes(name)) await walk(h, rel + '/' + name, out); }
        else if (/\.cdb$/i.test(name)) out.push({ file: await h.getFile(), rel: rel + '/' + name });
    }
}
async function loadFromHandle(base) {
    setStatus('Recherche des .cdb…');
    const items = [];
    for (const p of CONFIG.SEARCH_PATHS) {
        try {
            let d = base;
            for (const seg of p.split('/')) d = await d.getDirectoryHandle(seg);
            await walk(d, p, items);
        } catch (e) { YGO.toast(`Introuvable dans « ${base.name} » : ${p}`, 'err'); }
    }
    await addFiles(items);
}
async function pickBase() {
    try {
        const h = await window.showDirectoryPicker({ id: 'ygo-projectignis', mode: 'read' });
        await saveHandle(h);
        await loadFromHandle(h);
    } catch (e) { if (e.name !== 'AbortError') YGO.toast('Erreur : ' + e.message, 'err'); }
}
$('loadBtn').addEventListener('click', async () => {
    const h = await getHandle();
    if (!h) return pickBase();
    if ((await h.requestPermission({ mode: 'read' })) !== 'granted') return YGO.toast('Autorisation refusée.', 'err');
    loadFromHandle(h);
});
$('changeBtn').addEventListener('click', pickBase);

(async () => {
    if (!FS) {
        $('loadBtn').disabled = $('changeBtn').disabled = true;
        $('manual').open = true;
        return setStatus('Ce navigateur ne peut pas mémoriser un dossier (utilise Chrome ou Edge) : ajoute les dossiers à la main ci-dessous.');
    }
    const h = await getHandle();
    if (h && CONFIG.AUTO_LOAD && (await h.queryPermission({ mode: 'read' })) === 'granted') return loadFromHandle(h);
    setStatus(h ? 'Clique sur « Charger ProjectIgnis » (le navigateur redemande l\'autorisation).'
                : `Clique sur « Charger ProjectIgnis » et choisis ${CONFIG.BASE} : une seule fois, il s'en souvient ensuite.`);
})();
</script>
</body>
