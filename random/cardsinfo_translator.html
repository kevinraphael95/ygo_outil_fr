<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traducteur d'archétypes · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ygo.css">
<script src="assets/ygo.js"></script>
</head>
<body>

<header class="app-header">
    <div class="app-header-inner">
        <a class="brand" href="index.html" title="Tous les outils">
            <div class="brand-logo"><i class="fa-solid fa-dragon"></i></div>
            <div>
                <div class="brand-name">YGO Tools</div>
                <div class="brand-sub">Boîte à outils Yu-Gi-Oh!</div>
            </div>
        </a>
        <div class="header-actions">
            <a class="icon-btn" href="index.html" title="Tous les outils" aria-label="Tous les outils"><i class="fa-solid fa-house"></i></a>
            <button class="icon-btn" id="theme-toggle" type="button"></button>
        </div>
    </div>
</header>

<main class="container wide">
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-language"></i></div>
        <div>
            <h1>Traducteur d'archétypes YGOPro</h1>
            <p>Traduit les <code>##setname</code> de ton cardinfo avec les noms officiels TCG récupérés sur Yugipedia.</p>
        </div>
    </section>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-language"></i> Langue et source</h2>

        <div class="grid-2">
            <div class="field">
                <label for="langSelect">Langue cible</label>
                <select id="langSelect">
                    <option value="french">Français (TCG officiel)</option>
                    <option value="german">Deutsch</option>
                    <option value="spanish">Español</option>
                    <option value="italian">Italiano</option>
                </select>
            </div>
            <div class="field">
                <label for="fileInput">Fichier <code>cardinfo_english.txt</code></label>
                <input type="file" id="fileInput" accept=".txt">
            </div>
        </div>

        <div class="field" style="margin-bottom:0;">
            <label for="input">…ou colle son contenu ici</label>
            <textarea id="input" placeholder="Colle ton cardinfo_english.txt ici…"></textarea>
        </div>
        <div class="stats" id="parseStats"></div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Traduction</h2>
        <div class="actions">
            <button id="startBtn" class="btn btn-primary" type="button"><i class="fa-solid fa-play"></i> Lancer la traduction officielle</button>
            <button id="stopBtn" class="btn btn-danger" type="button" disabled><i class="fa-solid fa-stop"></i> Stop</button>
            <button id="exportBtn" class="btn" type="button" disabled><i class="fa-solid fa-download"></i> Exporter <span id="exportName">cardinfo_fr_setname.txt</span></button>
        </div>
        <div class="progress">
            <div class="progress-meta"><span class="progress-text">En attente</span><span class="progress-percent">0%</span></div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-table-list"></i> Résultats</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Hex</th><th>Nom EN</th><th>Traduction officielle</th><th>Statut</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</main>

<footer class="app-footer">YGO Tools · tout s'exécute dans ton navigateur</footer>
<div class="toasts" id="toasts"></div>

<script>
const { $ } = YGO;
const YUGIPEDIA_API = 'https://yugipedia.com/api.php';
const CONCURRENCY = 3;       // requêtes en parallèle
const DELAY_MS = 150;        // pause par worker entre deux entrées

const LANGS = {
    french:  { field: 'fr_name', ext: 'fr' },
    german:  { field: 'de_name', ext: 'de' },
    spanish: { field: 'es_name', ext: 'es' },
    italian: { field: 'it_name', ext: 'it' },
};

const progress = YGO.progress(document.querySelector('.progress'));
let entries = [];
let results = [];
let stopRequested = false;
let lastLang = 'french';

const exportName = () => `cardinfo_${LANGS[lastLang].ext}_setname.txt`;
$('langSelect').addEventListener('change', () => {
    $('exportName').textContent = `cardinfo_${LANGS[$('langSelect').value].ext}_setname.txt`;
});

function parseSetname(text) {
    const found = [];
    let inSetname = false;
    for (const raw of text.split('\n')) {
        const line = raw.replace(/\r$/, '');
        if (line.startsWith('##')) { inSetname = line.trim() === '##setname'; continue; }
        if (line.trim() === '#end') break;
        if (!inSetname || !line.trim()) continue;
        const m = line.match(/^(-?\d+|0x[0-9a-fA-F]+)[\t ]+(.+)$/);
        if (m) found.push({ hex: m[1], label: m[2].trim() });
    }
    return found;
}

function extractLang(wikitext, field) {
    if (!wikitext) return null;
    const m = wikitext.match(new RegExp('\\|\\s*' + field + '\\s*=\\s*([^\\n|]+)', 'i'));
    if (!m) return null;
    const val = m[1].trim()
        .replace(/\{\{Ruby\|([^|]+)\|[^}]+\}\}/gi, '$1')
        .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2')
        .replace(/\[\[([^\]]+)\]\]/g, '$1')
        .replace(/<ref[^>]*>.*?<\/ref>/gi, '')
        .split('\n')[0].trim().replace(/''/g, '');
    return val && val !== '—' && val !== '-' ? val : null;
}

async function fetchWikitext(page) {
    const params = new URLSearchParams({ action: 'parse', format: 'json', origin: '*', page, prop: 'wikitext', redirects: '1' });
    try {
        const res = await fetch(`${YUGIPEDIA_API}?${params}`);
        const data = await res.json();
        return data?.parse?.wikitext?.['*'] || null;
    } catch (e) { return null; }
}

function setStats(done, translated, missing, total) {
    progress.set(total ? (done / total) * 100 : 0, `${done} / ${total}`);
    $('stats').replaceChildren(
        YGO.el('span', { className: 'chip ok', text: `✅ ${translated} traduits` }),
        YGO.el('span', { className: 'chip warn', text: `⚠️ ${missing} non trouvés` }));
}

async function runScraping() {
    stopRequested = false;
    results = [];
    lastLang = $('langSelect').value;
    const field = LANGS[lastLang].field;
    const total = entries.length;
    let done = 0, translated = 0, missing = 0, next = 0;

    $('exportBtn').disabled = true;
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;

    const tbody = $('tbody');
    tbody.replaceChildren();
    const rows = entries.map((e) => {
        const tr = YGO.el('tr', {},
            YGO.el('td', { className: 'mono', text: e.hex }),
            YGO.el('td', { text: e.label }),
            YGO.el('td', { className: 'dim', text: '…' }),
            YGO.el('td', { text: 'en attente' }));
        tbody.append(tr);
        return tr;
    });
    setStats(0, 0, 0, total);

    async function worker() {
        while (!stopRequested) {
            const i = next++;
            if (i >= total) return;
            const e = entries[i];
            let val = extractLang(await fetchWikitext(e.label), field);
            if (!val) val = extractLang(await fetchWikitext(`${e.label} (archetype)`), field);

            const tr = rows[i];
            if (val) {
                translated++;
                tr.className = 'ok';
                tr.children[2].className = '';
                tr.children[2].textContent = val;
                tr.children[3].textContent = 'officiel';
                results[i] = { hex: e.hex, tr: val };
            } else {
                missing++;
                tr.className = 'miss';
                tr.children[2].className = '';
                tr.children[2].textContent = e.label;          // garde l'anglais si absent
                tr.children[3].textContent = 'non trouvé';
                results[i] = { hex: e.hex, tr: e.label };
            }
            setStats(++done, translated, missing, total);
            await YGO.sleep(DELAY_MS);
        }
    }

    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, total) }, worker));

    $('startBtn').disabled = false;
    $('stopBtn').disabled = true;
    $('exportBtn').disabled = false;
    $('exportName').textContent = exportName();
    YGO.toast(stopRequested ? `Arrêté : ${translated} traduits, ${missing} non trouvés.`
                            : `Terminé : ${translated} traduits, ${missing} non trouvés.`);
}

function buildFile() {
    const lines = ['################ use tab', '##setname'];
    for (const r of results) if (r) lines.push(`${r.hex}\t${r.tr}`);
    lines.push('#end');
    return lines.join('\n');
}

function updateParsed(text) {
    entries = parseSetname(text);
    $('parseStats').replaceChildren(
        YGO.el('span', { className: 'chip' + (entries.length ? ' ok' : ''), text: `📊 ${entries.length} archétypes détectés` }));
    return entries.length;
}

$('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    $('input').value = text;
    YGO.toast(`${updateParsed(text)} archétypes chargés.`);
});
$('input').addEventListener('input', () => updateParsed($('input').value));

$('startBtn').addEventListener('click', () => {
    if (!updateParsed($('input').value)) return YGO.toast('Aucun archétype valide détecté dans le texte.', 'err');
    runScraping();
});
$('stopBtn').addEventListener('click', () => { stopRequested = true; YGO.toast('Arrêt demandé…', 'err'); });
$('exportBtn').addEventListener('click', () => {
    YGO.download(buildFile(), exportName(), 'text/plain;charset=utf-8');
    YGO.toast('Fichier exporté avec succès !');
});
</script>
</body>
</html>
