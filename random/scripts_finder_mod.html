<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripts modifiés (overwrite) · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ygo.css">
<script src="assets/ygo.js"></script>
</head>
<body>

<header class="app-header">
    <div class="app-header-inner">
        <a class="brand" href="index.html" title="Tous les outils">
            <div class="brand-logo"><i class="fa-solid fa-dragon"></i></div>
            <div>
                <div class="brand-name">YGO Tools</div>
                <div class="brand-sub">Boîte à outils Yu-Gi-Oh!</div>
            </div>
        </a>
        <div class="header-actions">
            <a class="icon-btn" href="index.html" title="Tous les outils" aria-label="Tous les outils"><i class="fa-solid fa-house"></i></a>
            <button class="icon-btn" id="theme-toggle" type="button"></button>
        </div>
    </div>
</header>

<main class="container">
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-file-pen"></i></div>
        <div>
            <h1>Générateur de scripts modifiés</h1>
            <p>Isole les cartes taguées et copie leur script officiel avec un en-tête de travail prêt à modifier.</p>
        </div>
    </section>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-gear"></i> Configuration</h2>

        <div class="field">
            <label for="customTag">Tag des cartes modifiées à isoler</label>
            <input type="text" id="customTag" value="[CUSTOM]" autocomplete="off">
        </div>

        <div class="grid-2">
            <div class="field">
                <label for="cdbFile">Fichier CDB custom (anglais)</label>
                <input type="file" id="cdbFile" accept=".cdb">
            </div>
            <div class="field">
                <label for="luaFolder">Dossier des scripts officiels (.lua)</label>
                <input type="file" id="luaFolder" webkitdirectory directory multiple>
                <span class="hint" id="luaHint"></span>
            </div>
        </div>

        <div class="actions">
            <button id="startBtn" class="btn btn-primary" type="button"><i class="fa-solid fa-play"></i> Lancer la génération des scripts modifiés</button>
        </div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-terminal"></i> Console d'exécution</h2>
        <div id="console" class="console" role="log"></div>
    </div>
</main>

<footer class="app-footer">YGO Tools · tout s'exécute dans ton navigateur</footer>
<div class="toasts" id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const { $ } = YGO;
const out = YGO.console($('console'));
const btn = $('startBtn');
YGO.bindFileCount($('luaFolder'), $('luaHint'), /^c\d+\.lua$/i);

let SQL = null;
YGO.initSql()
    .then((s) => { SQL = s; out.log('Moteur SQL prêt.', 'ok'); })
    .catch((e) => out.log('Impossible de charger sql.js : ' + e.message, 'err'));

const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();

function readCdb(buffer) {
    const db = new SQL.Database(new Uint8Array(buffer));
    try {
        const res = db.exec('SELECT id, name, "desc" FROM texts');
        return res.length ? res[0].values.map(([id, name, desc]) => ({ id, name: name || '', desc: desc || '' })) : [];
    } finally { db.close(); }
}

async function readLua(files) {
    const list = [...files].filter((f) => /^c\d+\.lua$/i.test(f.name));
    const map = new Map();
    for (let i = 0; i < list.length; i += 64) {          // lecture par paquets en parallèle
        const slice = list.slice(i, i + 64);
        const texts = await Promise.all(slice.map((f) => f.text()));
        slice.forEach((f, k) => map.set(parseInt(f.name.match(/\d+/)[0], 10), texts[k]));
    }
    return map;
}

/** Cherche le script source : même ID, sinon un script qui cite le nom de la carte. */
function makeFinder(luaMap) {
    let lower = null;
    return (cid, name) => {
        if (luaMap.has(cid)) return cid;
        const n = norm(name);
        if (!n) return null;
        if (!lower) lower = [...luaMap].map(([oid, code]) => [oid, code.toLowerCase()]);
        for (const [oid, code] of lower) if (code.includes(n)) return oid;
        return null;
    };
}

/** Remplace l'ancien ID par le nouveau (cOLD -> cNEW puis OLD -> NEW). */
function retarget(code, oid, cid) {
    return code
        .replace(new RegExp('\\bc' + oid + '\\b', 'g'), 'c' + cid)
        .replace(new RegExp('\\b' + oid + '\\b', 'g'), String(cid));
}

async function zipAndDownload(zip, filename) {
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    return YGO.download(blob, filename);
}

out.log('Prêt à traiter les cartes modifiées…');

btn.addEventListener('click', async () => {
    if (!SQL) return YGO.toast('Moteur SQL en cours de chargement…', 'err');
    const cdb = $('cdbFile').files[0];
    const luaFiles = $('luaFolder').files;
    const tag = $('customTag').value.trim().toLowerCase();
    if (!cdb) return YGO.toast('Sélectionne un fichier CDB.', 'err');
    if (!luaFiles.length) return YGO.toast('Sélectionne le dossier des scripts Lua.', 'err');
    if (!tag) return YGO.toast('Indique le tag des cartes modifiées.', 'err');

    btn.disabled = true;
    out.clear();
    try {
        out.log('📂 Lecture du CDB des cartes modifiées…');
        const cards = readCdb(await cdb.arrayBuffer());
        out.log(`→ ${cards.length} cartes lues.`);

        out.log('📂 Lecture des scripts Lua…');
        const luaMap = await readLua(luaFiles);
        out.log(`→ ${luaMap.size} scripts valides.`);
        const find = makeFinder(luaMap);

        out.log('🔄 Isolation des cartes taguées…');
        const zip = new JSZip();
        let generated = 0, ignored = 0, noMatch = 0;

        for (const { id: cid, name, desc } of cards) {
            if (!desc.toLowerCase().includes(tag)) { ignored++; continue; }
            const oid = find(cid, name);
            if (oid == null) { noMatch++; out.log(`! Aucun script source pour ${name} (${cid})`, 'warn'); continue; }

            const code = retarget(luaMap.get(oid), oid, cid);
            zip.file(`c${cid}.lua`, `--[MODIFIED] base copiée de c${oid}.lua (${name}) - à modifier\n` + code);
            generated++;
        }

        if (!generated) {
            out.log('⚠️ Aucune carte taguée n\'a produit de script.', 'warn');
            return YGO.toast('Aucun script généré.', 'err');
        }
        out.log(`📦 Compression de ${generated} scripts…`);
        const size = await zipAndDownload(zip, 'scripts_modifies_overwrite.zip');
        out.log(`✅ ${generated} scripts exportés (${YGO.fmtBytes(size)}) · ${ignored} cartes non taguées ignorées · ${noMatch} sans script.`, 'ok');
        YGO.toast(`${generated} scripts modifiés exportés !`);
    } catch (err) {
        out.log('❌ Erreur critique : ' + err.message, 'err');
        YGO.toast('Une erreur est survenue.', 'err');
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
