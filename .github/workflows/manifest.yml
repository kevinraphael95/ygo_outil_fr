# Génère data/manifest.json : la liste des CDB (par langue), des dossiers de scripts
# et des illustrations custom (data/YUGIOH CUSTOM ART).
# Les outils en ont besoin car un site statique ne peut pas lister un dossier.
# Se lance tout seul à chaque modification de data/, ou à la main (onglet Actions → Run workflow).
name: Générer data/manifest.json

on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le manifest
        run: |
          python3 - <<'PY'
          import json, os
          m = {'cdb': {}, 'script': [], 'art': []}
          cdb = 'data/cdb'
          if os.path.isdir(cdb):
              for lang in sorted(os.listdir(cdb)):
                  p = os.path.join(cdb, lang)
                  if os.path.isdir(p):
                      m['cdb'][lang] = sorted(f for f in os.listdir(p) if f.lower().endswith('.cdb'))
          sc = 'data/script'
          if os.path.isdir(sc):
              m['script'] = sorted(d for d in os.listdir(sc) if os.path.isdir(os.path.join(sc, d)))
          art = 'data/YUGIOH CUSTOM ART'
          if os.path.isdir(art):
              m['art'] = sorted(f for f in os.listdir(art) if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp')))
          with open('data/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False, indent=1)
              f.write('\n')
          PY

      - name: Enregistrer si le manifest a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git diff --cached --quiet || (git commit -m "Mise à jour de data/manifest.json" && git push)
