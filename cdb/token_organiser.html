<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réorganisateur de tokens CDB · YGO Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../utils/ygo.css">
<script src="../utils/ygo.js"></script>
</head>
<body>

<header class="app-header">
    <div class="app-header-inner">
        <a class="brand" href="../index.html" title="Tous les outils">
            <div class="brand-logo"><i class="fa-solid fa-dragon"></i></div>
            <div>
                <div class="brand-name">YGO Tools</div>
                <div class="brand-sub">Boîte à outils Yu-Gi-Oh!</div>
            </div>
        </a>
        <div class="header-actions">
            <a class="icon-btn" href="../index.html" title="Tous les outils" aria-label="Tous les outils"><i class="fa-solid fa-house"></i></a>
            <button class="icon-btn" id="theme-toggle" type="button"></button>
        </div>
    </div>
</header>

<main class="container">
    <section class="hero">
        <div class="hero-icon"><i class="fa-solid fa-clone"></i></div>
        <div>
            <h1>Réorganisateur de tokens CDB</h1>
            <p>Place chaque token juste après la carte qui l'invoque et renumérote les IDs.</p>
        </div>
    </section>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-file-arrow-up"></i> Fichier CDB source</h2>
        <div class="field">
            <label for="cdbFile">Sélectionne ton fichier .cdb</label>
            <input type="file" id="cdbFile" accept=".cdb">
        </div>
        <div class="actions">
            <button id="startBtn" class="btn btn-primary" type="button"><i class="fa-solid fa-play"></i> Réorganiser et télécharger</button>
        </div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-terminal"></i> Console d'exécution</h2>
        <div id="console" class="console" role="log"></div>
    </div>
</main>

<footer class="app-footer">YGO Tools · tout s'exécute dans ton navigateur</footer>
<div class="toasts" id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
const { $ } = YGO;
const TOKEN_TYPE = 0x4000;
const out = YGO.console($('console'));
const btn = $('startBtn');
out.log('En attente du fichier CDB…');

let SQL = null;
YGO.initSql()
    .then((s) => { SQL = s; out.log('Moteur SQL prêt.', 'ok'); })
    .catch((e) => out.log('Impossible de charger sql.js : ' + e.message, 'err'));

/** Lit toute une table en un seul passage : { columns, rows }. */
function readTable(db, table) {
    const res = db.exec(`SELECT * FROM ${table} ORDER BY id`);
    return res.length ? { columns: res[0].columns, rows: res[0].values } : { columns: [], rows: [] };
}

btn.addEventListener('click', async () => {
    if (!SQL) return YGO.toast('Moteur SQL en cours de chargement…', 'err');
    const file = $('cdbFile').files[0];
    if (!file) return YGO.toast('Sélectionne un fichier .cdb', 'err');

    btn.disabled = true;
    out.clear();
    let srcDb = null, dstDb = null;
    try {
        out.log('📂 Chargement du fichier CDB…');
        srcDb = new SQL.Database(new Uint8Array(await file.arrayBuffer()));

        const datas = readTable(srcDb, 'datas');
        const texts = readTable(srcDb, 'texts');
        const col = (cols, n) => cols.indexOf(n);
        const D = { id: col(datas.columns, 'id'), type: col(datas.columns, 'type'), alias: col(datas.columns, 'alias') };
        const T = { id: col(texts.columns, 'id'), name: col(texts.columns, 'name'), desc: col(texts.columns, 'desc') };
        if (Object.values(D).includes(-1) || Object.values(T).includes(-1)) {
            throw new Error('Ce fichier ne ressemble pas à un CDB YGOPro (tables datas/texts).');
        }

        const textById = new Map(texts.rows.map((r) => [r[T.id], r]));
        const entries = [];
        for (const d of datas.rows) {
            const t = textById.get(d[D.id]);
            if (!t) continue;
            entries.push({ id: d[D.id], type: d[D.type], d, t, name: t[T.name] || '', desc: t[T.desc] || '' });
        }
        if (!entries.length) throw new Error('Aucune carte trouvée dans ce CDB.');
        out.log(`→ ${entries.length} entrées lues.`);

        const cards = entries.filter((e) => !(e.type & TOKEN_TYPE));
        const tokens = entries.filter((e) => e.type & TOKEN_TYPE);

        const byName = new Map();
        for (const c of cards) {
            if (!byName.has(c.name)) byName.set(c.name, []);
            byName.get(c.name).push(c);
        }

        /* Rattachement de chaque token à la carte qui l'invoque */
        const after = new Map();
        const orphans = [];
        for (const tk of tokens) {
            const m = tk.desc.match(/"([^"]+)"/);
            const cands = m ? byName.get(m[1]) : null;
            if (!cands) { orphans.push(tk); continue; }
            let pool = cands;
            if (cands.length > 1) {
                const citing = cands.filter((c) => c.desc.includes(tk.name));
                if (citing.length) pool = citing;
                else out.log(`! Ambigu : ${tk.name} (${tk.id}) → plusieurs cartes « ${m[1]} », la première est prise`, 'warn');
            }
            const host = pool[0].id;
            if (!after.has(host)) after.set(host, []);
            after.get(host).push(tk);
        }

        /* Nouvel ordre + renumérotation à partir du premier ID */
        const order = [];
        for (const c of cards) { order.push(c); if (after.has(c.id)) order.push(...after.get(c.id)); }
        order.push(...orphans);

        const startId = entries[0].id;
        const mapping = new Map(order.map((e, i) => [e.id, startId + i]));

        /* Base de sortie : mêmes schémas, lignes réinsérées dans le nouvel ordre */
        dstDb = new SQL.Database();
        const schemas = srcDb.exec("SELECT sql FROM sqlite_master WHERE sql IS NOT NULL AND name NOT LIKE 'sqlite_%' ORDER BY type DESC");
        if (schemas.length) for (const [sql] of schemas[0].values) dstDb.run(sql);

        const qs = (n) => Array(n).fill('?').join(',');
        const insD = dstDb.prepare(`INSERT INTO datas VALUES (${qs(datas.columns.length)})`);
        const insT = dstDb.prepare(`INSERT INTO texts VALUES (${qs(texts.columns.length)})`);
        dstDb.run('BEGIN TRANSACTION;');
        for (const e of order) {
            const newId = mapping.get(e.id);
            const d = e.d.slice(); d[D.id] = newId;
            if (d[D.alias]) d[D.alias] = mapping.get(d[D.alias]) ?? d[D.alias];
            insD.run(d);
            const t = e.t.slice(); t[T.id] = newId;
            insT.run(t);
        }
        dstDb.run('COMMIT;');
        insD.free(); insT.free();

        const stem = file.name.replace(/\.[^/.]+$/, '');
        const size = YGO.download(dstDb.export(), `${stem}_tokens.cdb`, 'application/x-sqlite3');

        out.log(`✅ ${tokens.length - orphans.length} tokens replacés, ${orphans.length} orphelin(s) · ${YGO.fmtBytes(size)}.`, 'ok');
        orphans.forEach((o) => out.log(`  orphelin : ${o.name} (${o.id})`, 'warn'));
        out.log('→ Fichier téléchargé avec succès !', 'ok');
        YGO.toast('Réorganisation terminée !');
    } catch (err) {
        out.log('❌ Erreur : ' + err.message, 'err');
        YGO.toast('Erreur lors du traitement du CDB.', 'err');
    } finally {
        if (srcDb) srcDb.close();
        if (dstDb) dstDb.close();
        btn.disabled = false;
    }
});
</script>
</body>
</html>
